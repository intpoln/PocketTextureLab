# Pocket Texture Lab — guide for AI agents and scripts

Pocket Texture Lab is an offline, single-file, node-based procedural texture
editor (WebGL2). Everything the UI can do is also available from JavaScript
through the global object `window.PTL`. If you are an agent driving this page
(Playwright, Puppeteer, DevTools console, browser extension), use `PTL`
instead of clicking: it is faster, exact and every call is validated with
readable error messages.

## Quick start

```js
// 1. Discover node types, ports and parameters (with ranges/options/help)
PTL.nodeTypes();

// 2. Build a graph (each mutating call = one undo step; batch() groups them)
const ids = PTL.batch(() => {
  const noise = PTL.addNode('noise', { params: { scale: 8, octaves: 6, seed: 42 } });
  const blur  = PTL.addNode('gaussian', { params: { sigma: 2 } });
  const nrm   = PTL.addNode('normal', { params: { strength: 5, convention: 'dx' } });
  const out   = PTL.addNode('output', { params: { filename: 'rock_normal' } });
  PTL.connect(noise, 0, blur, 0);   // (fromNode, outputPort, toNode, inputPort)
  PTL.connect(blur, 0, nrm, 0);
  PTL.connect(nrm, 0, out, 0);
  return { noise, blur, nrm, out };
});
PTL.autoLayout();

// 3. Inspect results (fresh GPU evaluation, 8-bit RGBA exactly as exported)
PTL.stats(ids.nrm);                       // {min,max,mean} per channel
PTL.pixel(ids.nrm, 10, 20);               // [r,g,b,a] 0..255, x right, y down
const png = await PTL.renderPNG(ids.out, { size: 1024 });  // Uint8Array (PNG file)
await PTL.renderDataURL(ids.out);         // "data:image/png;base64,..."
await PTL.exportPNG(ids.out);             // triggers a browser download
```

## API reference

Discovery / state
- `PTL.help()` — this text.
- `PTL.nodeTypes()` — `[{type, title, category, inputs[], outputs[], params[{key,type,min,max,options,default,help}], presets[], help}]`.
- `PTL.getGraph()` — `{resolution, activeOutput, nodes:[{id,type,x,y,params}], links:[{from,fromPort,to,toPort}]}`.
- `PTL.getNode(id)`, `PTL.getParams(id)`, `PTL.errors()` (per-node errors, e.g. GLSL compile logs), `PTL.info()`.

Editing (all validated; unknown params/enum values throw with the list of valid ones)
- `PTL.addNode(type, {params, x, y})` → node id (e.g. `"n7"`). Without x/y the node is placed to the right.
- `PTL.setParams(id, {key: value, ...})`, `PTL.applyPreset(id, label)`, `PTL.moveNode(id, x, y)`.
- `PTL.connect(fromId, fromPort, toId, toPort)` — an input takes one link (replaces the old one); outputs fan out; cycles throw.
- `PTL.disconnect(toId, toPort)`, `PTL.removeNode(id)`, `PTL.duplicate(id)`.
- `PTL.setActiveOutput(outputId)`, `PTL.setResolution(256|512|1024|2048)`, `PTL.select(id)`.
- `PTL.batch(fn)` — several edits as one undo step. `PTL.undo()`, `PTL.redo()`, `PTL.autoLayout()`.
- `PTL.newProject()`, `PTL.examples()`, `PTL.loadExample(i)`.

Images and projects
- `await PTL.importImage(bytes | base64 | dataURL, {name, nodeId?, interp:'srgb'|'data', fit:'stretch'|'cover'|'tile'})` → image node id.
- `PTL.saveProject()` → project JSON object (images embedded as base64). `await PTL.loadProject(obj|string)`.

Rendering
- `PTL.render(id, {size, port})` → `{width, height, space, rgba: Uint8Array}` (file values, rows top→bottom).
- `await PTL.renderPNG(id, {size, port})` → PNG bytes (Uint8Array); `await PTL.renderPNGBase64(...)`, `await PTL.renderDataURL(...)`.
- `PTL.pixel(id, x, y, {size})`, `PTL.stats(id, {size})`, `await PTL.exportPNG(id?)` (download).
- `PTL.setView({mode:0..6, tile3, half})` — preview: 0 RGB, 1 RGBA, 2 R, 3 G, 4 B, 5 A, 6 lit normal; 3×3 tiling; half-offset.

## Conventions you must know

- Image coordinates: x → right, y → down, row 0 is the top row. UV = pixel centre / size.
- Spaces: `color` results are linear light inside and sRGB in files/preview; `data` results
  (masks, height, normals, packed channels) are written as-is, never gamma corrected.
  Levels, Invert, HSV, Grayscale, Color Ramp and the Code node work on file (sRGB) values.
- Missing inputs use documented defaults (see `inputs[].whenUnconnected`), usually black (0,0,0,1).
- Normals: tangent space, +X right, +Y up (OpenGL). `convention:'dx'` flips only green.
  Flat height → (128,128,255,255). `strength` = relief height in % of texture width.
- Tileable noise/voronoi use integer scale (periodic in u and v). Blur/normal with `wrap:'repeat'` sample across edges.
- Filter radii are in project pixels; lower-resolution previews scale them.

## Node types (ids)

Sources: `image`, `constant`, `noise`, `voronoi`, `shape`, `gradient`.
Adjust: `levels`, `invert`, `grayscale`, `ramp`, `hsv`, `blend` (inputs A=0, B=1, mask=2), `transform`.
Blur: `gaussian`, `dirblur`, `radialblur`. Normal: `normal`. Channels: `split` (outputs R,G,B,A = ports 0..3),
`combine` (inputs R,G,B,A = ports 0..3; presets `orm`, `hdrp`, `custom`; per channel `rSrc` R|G|B|A|L|C, `rVal`, `rInv`).
Custom code: `code`. Output: `output` (param `filename`).

## Writing new functionality: the `code` node (GLSL ES 3.00)

The `code` node runs your fragment function on the GPU for every pixel:

```glsl
vec4 process(vec2 uv, ivec2 px) {
  vec4 a = in0(px);                    // exact texel of input A (0..3 = A..D)
  vec4 b = in1UV(uv + vec2(0.01, 0.0)); // bilinear, wraps around (repeat)
  float n = float(pcg3(uvec3(uvec2(px), 7u)).x) / 4294967295.0; // hash noise
  return vec4(mix(a.rgb, b.rgb, p1), 1.0);   // p1..p4 = sliders
}
```

- Inputs arrive as file values (colour inputs sRGB-encoded). Unconnected input = (0,0,0,1).
- Helpers: `u_res` (vec2 size), `PI`, `LUMA`, `toLin()`, `toSrgb()`, `pcg3(uvec3)`, `wrapPx(ivec2, bool repeat)`, `pix()`, `pixUV()`.
- Param `space`: `data` (write numbers as-is) or `color` (returned values are sRGB).
- Compile errors appear in `PTL.errors()[id]` and in the node panel (line numbers match your code).
- For tileable results use only integer frequencies of `uv` and repeat sampling.

```js
const c = PTL.addNode('code', { params: {
  code: 'vec4 process(vec2 uv, ivec2 px){ float v = 0.5+0.5*sin(uv.x*6.2831853*p1*16.0); return vec4(vec3(v),1.0); }',
  p1: 0.25 } });
PTL.errors()[c];   // undefined when it compiled
```

## Typical recipes

- Packed ORM: masks → `combine` (preset `orm`) → `output`.
- HDRP mask: connect Roughness to port 3 of `combine` (preset `hdrp`) and set `aInv: true` (smoothness = 1 − roughness).
- Normal map for Unreal: `normal` with `convention:'dx'` or `PTL.applyPreset(id, 'Unreal / DirectX −Y')`.
- Check seams: `PTL.setView({tile3:true, half:true})`.

  <main>
    <aside id="catalog">
      <input id="search" type="search" placeholder="Поиск ноды… (Enter — добавить)">
      <div class="list" id="catalog-list"></div>
    </aside>
    <section id="graph" tabindex="0">
      <div id="graph-inner"><svg id="wires"></svg><div id="nodes"></div></div>
      <div id="graph-empty"></div>
      <div id="graph-hud"><span id="zoom-label">100%</span><button id="btn-fit" title="Показать весь граф (F)">Весь граф</button><button id="btn-layout" title="Расставить ноды по слоям">Упорядочить</button></div>
    </section>
    <div class="split-v" id="split-v" title="Изменить ширину панели"></div>
    <aside id="right">
      <section id="preview">
        <div class="bar">
          <button data-view="0" class="on" title="RGB">RGB</button>
          <button data-view="1" title="RGBA на шахматке">RGBA</button>
          <button data-view="2">R</button><button data-view="3">G</button><button data-view="4">B</button><button data-view="5">A</button>
          <button data-view="6" title="Освещённая плоскость по normal map">Normal</button>
          <span class="grow"></span>
          <select id="view-port" title="Выход ноды" style="display:none"></select>
          <button id="btn-tile" title="Повтор 3×3 для проверки швов">3×3</button>
          <button id="btn-half" title="Сдвиг на половину текстуры: швы окажутся в центре">½</button>
          <button id="btn-vfit" title="Вписать (двойной щелчок)">⤢</button>
        </div>
        <div class="lightbar" id="lightbar">
          Свет: азимут <input type="range" id="l-az" min="-180" max="180" value="135">
          высота <input type="range" id="l-el" min="5" max="90" value="40">
          <select id="l-conv"><option value="auto">Y: авто</option><option value="gl">OpenGL +Y</option><option value="dx">DirectX −Y</option></select>
        </div>
        <div id="canvas-wrap"><canvas id="view"></canvas><div id="lost">Контекст WebGL потерян. Граф и параметры сохранены — ожидаю восстановления…</div></div>
        <div class="info" id="pinfo"></div>
      </section>
      <div class="split-h" id="split-h" title="Изменить высоту предпросмотра"></div>
      <section id="params"></section>
    </aside>
  </main>
  <footer id="status"><span class="msg" id="status-msg"></span><span id="status-gpu"></span></footer>
</div>
<div id="toasts"></div>
<div class="modal-bg" id="modal"><div class="modal"><div class="mh"><h2 id="modal-title"></h2><button id="modal-close">Закрыть</button></div><div class="mb" id="modal-body"></div></div></div>
<div id="fatal"><div class="box" id="fatal-box"></div></div>
<input type="file" id="file-project" accept=".json,application/json" hidden>
<input type="file" id="file-image" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>

UPNG.decode = function(buff)
{
	var data = new Uint8Array(buff), offset = 8, bin = UPNG._bin, rUs = bin.readUshort, rUi = bin.readUint;

	var dd = new Uint8Array(data.length), doff = 0;	 // put all IDAT data into it
	var fd, foff = 0;	// frames
	
	var mgck = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
	for(var i=0; i<8; i++) if(data[i]!=mgck[i]) throw "The input is not a PNG file!";

	while(offset<data.length)
	{
		var len  = bin.readUint(data, offset);  offset += 4;
		var type = bin.readASCII(data, offset, 4);  offset += 4;
		//log(type,len);
		
		if     (type=="IHDR")  {  UPNG.decode._IHDR(data, offset, out);  }
		else if(type=="IDAT") {
			for(var i=0; i<len; i++) dd[doff+i] = data[offset+i];
			doff += len;
		}
		else if(type=="acTL")  {
			out.tabs[type] = {  num_frames:rUi(data, offset), num_plays:rUi(data, offset+4)  };
			fd = new Uint8Array(data.length);
		}
		else if(type=="fcTL")  {
			if(foff!=0) {  var fr = out.frames[out.frames.length-1];
				fr.data = UPNG.decode._decompress(out, fd.slice(0,foff), fr.rect.width, fr.rect.height);  foff=0;
			}
			var rct = {x:rUi(data, offset+12),y:rUi(data, offset+16),width:rUi(data, offset+4),height:rUi(data, offset+8)};
			var del = rUs(data, offset+22);  del = rUs(data, offset+20) / (del==0?100:del);
			var frm = {rect:rct, delay:Math.round(del*1000), dispose:data[offset+24], blend:data[offset+25]};
			//console.log(frm);
			out.frames.push(frm);
		}
		else if(type=="fdAT") {
			for(var i=0; i<len-4; i++) fd[foff+i] = data[offset+i+4];
			foff += len-4;
		}
		else if(type=="pHYs") {
			out.tabs[type] = [bin.readUint(data, offset), bin.readUint(data, offset+4), data[offset+8]];
		}
		else if(type=="cHRM") {
			out.tabs[type] = [];
			for(var i=0; i<8; i++) out.tabs[type].push(bin.readUint(data, offset+i*4));
		}
		else if(type=="tEXt") {
			if(out.tabs[type]==null) out.tabs[type] = {};
			var nz = bin.nextZero(data, offset);
			var keyw = bin.readASCII(data, offset, nz-offset);
			var text = bin.readASCII(data, nz+1, offset+len-nz-1);
			out.tabs[type][keyw] = text;
		}
		else if(type=="iTXt") {
			if(out.tabs[type]==null) out.tabs[type] = {};
			var nz = 0, off = offset;
			nz = bin.nextZero(data, off);
			var keyw = bin.readASCII(data, off, nz-off);  off = nz + 1;
			var cflag = data[off], cmeth = data[off+1];  off+=2;
			nz = bin.nextZero(data, off);
			var ltag = bin.readASCII(data, off, nz-off);  off = nz + 1;
			nz = bin.nextZero(data, off);
			var tkeyw = bin.readUTF8(data, off, nz-off);  off = nz + 1;
			var text  = bin.readUTF8(data, off, len-(off-offset));
			out.tabs[type][keyw] = text;
		}
		else if(type=="PLTE") {
			out.tabs[type] = bin.readBytes(data, offset, len);
		}
		else if(type=="hIST") {
			var pl = out.tabs["PLTE"].length/3;
			out.tabs[type] = [];  for(var i=0; i<pl; i++) out.tabs[type].push(rUs(data, offset+i*2));
		}
		else if(type=="tRNS") {
			if     (out.ctype==3) out.tabs[type] = bin.readBytes(data, offset, len);
			else if(out.ctype==0) out.tabs[type] = rUs(data, offset);
			else if(out.ctype==2) out.tabs[type] = [ rUs(data,offset),rUs(data,offset+2),rUs(data,offset+4) ];
			//else console.log("tRNS for unsupported color type",out.ctype, len);
		}
		else if(type=="gAMA") out.tabs[type] = bin.readUint(data, offset)/100000;
		else if(type=="sRGB") out.tabs[type] = data[offset];
		else if(type=="bKGD")
		{
			if     (out.ctype==0 || out.ctype==4) out.tabs[type] = [rUs(data, offset)];
			else if(out.ctype==2 || out.ctype==6) out.tabs[type] = [rUs(data, offset), rUs(data, offset+2), rUs(data, offset+4)];
			else if(out.ctype==3) out.tabs[type] = data[offset];
		}
		else if(type=="IEND") {
			if(foff!=0) {  var fr = out.frames[out.frames.length-1];
				fr.data = UPNG.decode._decompress(out, fd.slice(0,foff), fr.rect.width, fr.rect.height);  foff=0;
			}	
			out.data = UPNG.decode._decompress(out, dd, out.width, out.height);  break;
		}
		//else {  log("unknown chunk type", type, len);  }
		offset += len;
		var crc = bin.readUint(data, offset);  offset += 4;
	}
	delete out.compress;  delete out.interlace;  delete out.filter;
	return out;
}

UPNG.decode._decompress = function(out, dd, w, h) {
	if(out.compress ==0) dd = UPNG.decode._inflate(dd);

	if     (out.interlace==0) dd = UPNG.decode._filterZero(dd, out, 0, w, h);
	else if(out.interlace==1) dd = UPNG.decode._readInterlace(dd, out);
	return dd;
}

UPNG.decode._inflate = function(data) {  return pako["inflate"](data);  }

UPNG.decode._readInterlace = function(data, out)
{
	var w = out.width, h = out.height;
	var bpp = UPNG.decode._getBPP(out), cbpp = bpp>>3, bpl = Math.ceil(w*bpp/8);
	var img = new Uint8Array( h * bpl );
	var di = 0;

	var starting_row  = [ 0, 0, 4, 0, 2, 0, 1 ];
	var starting_col  = [ 0, 4, 0, 2, 0, 1, 0 ];
	var row_increment = [ 8, 8, 8, 4, 4, 2, 2 ];
	var col_increment = [ 8, 8, 4, 4, 2, 2, 1 ];

	var pass=0;
	while(pass<7)
	{
		var ri = row_increment[pass], ci = col_increment[pass];
		var sw = 0, sh = 0;
		var cr = starting_row[pass];  while(cr<h) {  cr+=ri;  sh++;  }
		var cc = starting_col[pass];  while(cc<w) {  cc+=ci;  sw++;  }
		var bpll = Math.ceil(sw*bpp/8);
		UPNG.decode._filterZero(data, out, di, sw, sh);

		var y=0, row = starting_row[pass];
		while(row<h)
		{
			var col = starting_col[pass];
			var cdi = (di+y*bpll)<<3;

			while(col<w)
			{
				if(bpp==1) {
					var val = data[cdi>>3];  val = (val>>(7-(cdi&7)))&1;
					img[row*bpl + (col>>3)] |= (val << (7-((col&7)<<0))); /* PTL patch: was col&3 (1-bit Adam7 bug) */
				}
				if(bpp==2) {
					var val = data[cdi>>3];  val = (val>>(6-(cdi&7)))&3;
					img[row*bpl + (col>>2)] |= (val << (6-((col&3)<<1)));
				}
				if(bpp==4) {
					var val = data[cdi>>3];  val = (val>>(4-(cdi&7)))&15;
					img[row*bpl + (col>>1)] |= (val << (4-((col&1)<<2)));
				}
				if(bpp>=8) {
					var ii = row*bpl+col*cbpp;
					for(var j=0; j<cbpp; j++) img[ii+j] = data[(cdi>>3)+j];
				}
				cdi+=bpp;  col+=ci;
			}
			y++;  row += ri;
		}
		if(sw*sh!=0) di += sh * (1 + bpll);
		pass = pass + 1;
	}
	return img;
}

UPNG.decode._getBPP = function(out) {
	var noc = [1,null,3,1,2,null,4][out.ctype];
	return noc * out.depth;
}

UPNG.decode._filterZero = function(data, out, off, w, h)
{
	var bpp = UPNG.decode._getBPP(out), bpl = Math.ceil(w*bpp/8), paeth = UPNG.decode._paeth;
	bpp = Math.ceil(bpp/8);

	for(var y=0; y<h; y++)  {
		var i = off+y*bpl, di = i+y+1;
		var type = data[di-1];

		if     (type==0) for(var x=  0; x<bpl; x++) data[i+x] = data[di+x];
		else if(type==1) {
			for(var x=  0; x<bpp; x++) data[i+x] = data[di+x];
			for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + data[i+x-bpp])&255;
		}
		else if(y==0) {
			for(var x=  0; x<bpp; x++) data[i+x] = data[di+x];
			if(type==2) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x])&255;
			if(type==3) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + (data[i+x-bpp]>>1) )&255;
			if(type==4) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + paeth(data[i+x-bpp], 0, 0) )&255;
		}
		else {
			if(type==2) { for(var x=  0; x<bpl; x++) data[i+x] = (data[di+x] + data[i+x-bpl])&255;  }

			if(type==3) { for(var x=  0; x<bpp; x++) data[i+x] = (data[di+x] + (data[i+x-bpl]>>1))&255;
			              for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + ((data[i+x-bpl]+data[i+x-bpp])>>1) )&255;  }

			if(type==4) { for(var x=  0; x<bpp; x++) data[i+x] = (data[di+x] + paeth(0, data[i+x-bpl], 0))&255;
						  for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + paeth(data[i+x-bpp], data[i+x-bpl], data[i+x-bpp-bpl]) )&255;  }
		}
	}
	return data;
}

UPNG.decode._paeth = function(a,b,c)
{
	var p = a+b-c, pa = Math.abs(p-a), pb = Math.abs(p-b), pc = Math.abs(p-c);
	if (pa <= pb && pa <= pc)  return a;
	else if (pb <= pc)  return b;
	return c;
}

UPNG.decode._IHDR = function(data, offset, out)
{
	var bin = UPNG._bin;
	out.width  = bin.readUint(data, offset);  offset += 4;
	out.height = bin.readUint(data, offset);  offset += 4;
	out.depth     = data[offset];  offset++;
	out.ctype     = data[offset];  offset++;
	out.compress  = data[offset];  offset++;
	out.filter    = data[offset];  offset++;
	out.interlace = data[offset];  offset++;
}

UPNG._bin = {
	nextZero   : function(data,p)  {  while(data[p]!=0) p++;  return p;  },
	readUshort : function(buff,p)  {  return (buff[p]<< 8) | buff[p+1];  },
	writeUshort: function(buff,p,n){  buff[p] = (n>>8)&255;  buff[p+1] = n&255;  },
	readUint   : function(buff,p)  {  return (buff[p]*(256*256*256)) + ((buff[p+1]<<16) | (buff[p+2]<< 8) | buff[p+3]);  },
	writeUint  : function(buff,p,n){  buff[p]=(n>>24)&255;  buff[p+1]=(n>>16)&255;  buff[p+2]=(n>>8)&255;  buff[p+3]=n&255;  },
	readASCII  : function(buff,p,l){  var s = "";  for(var i=0; i<l; i++) s += String.fromCharCode(buff[p+i]);  return s;    },
	writeASCII : function(data,p,s){  for(var i=0; i<s.length; i++) data[p+i] = s.charCodeAt(i);  },
	readBytes  : function(buff,p,l){  var arr = [];   for(var i=0; i<l; i++) arr.push(buff[p+i]);   return arr;  },
	pad : function(n) { return n.length < 2 ? "0" + n : n; },
	readUTF8 : function(buff, p, l) {
		var s = "", ns;
		for(var i=0; i<l; i++) s += "%" + UPNG._bin.pad(buff[p+i].toString(16));
		try {  ns = decodeURIComponent(s); }
		catch(e) {  return UPNG._bin.readASCII(buff, p, l);  }
		return  ns;
	}
}
UPNG._copyTile = function(sb, sw, sh, tb, tw, th, xoff, yoff, mode)
{
	var w = Math.min(sw,tw), h = Math.min(sh,th);
	var si=0, ti=0;
	for(var y=0; y<h; y++)
		for(var x=0; x<w; x++)
		{
			if(xoff>=0 && yoff>=0) {  si = (y*sw+x)<<2;  ti = (( yoff+y)*tw+xoff+x)<<2;  }
			else                   {  si = ((-yoff+y)*sw-xoff+x)<<2;  ti = (y*tw+x)<<2;  }
			
			if     (mode==0) {  tb[ti] = sb[si];  tb[ti+1] = sb[si+1];  tb[ti+2] = sb[si+2];  tb[ti+3] = sb[si+3];  }
			else if(mode==1) {
				var fa = sb[si+3]*(1/255), fr=sb[si]*fa, fg=sb[si+1]*fa, fb=sb[si+2]*fa; 
				var ba = tb[ti+3]*(1/255), br=tb[ti]*ba, bg=tb[ti+1]*ba, bb=tb[ti+2]*ba; 
				
				var ifa=1-fa, oa = fa+ba*ifa, ioa = (oa==0?0:1/oa);
				tb[ti+3] = 255*oa;  
				tb[ti+0] = (fr+br*ifa)*ioa;  
				tb[ti+1] = (fg+bg*ifa)*ioa;   
				tb[ti+2] = (fb+bb*ifa)*ioa;  
			}
			else if(mode==2){	// copy only differences, otherwise zero
				var fa = sb[si+3], fr=sb[si], fg=sb[si+1], fb=sb[si+2]; 
				var ba = tb[ti+3], br=tb[ti], bg=tb[ti+1], bb=tb[ti+2]; 
				if(fa==ba && fr==br && fg==bg && fb==bb) {  tb[ti]=0;  tb[ti+1]=0;  tb[ti+2]=0;  tb[ti+3]=0;  }
				else {  tb[ti]=fr;  tb[ti+1]=fg;  tb[ti+2]=fb;  tb[ti+3]=fa;  }
			}
			else if(mode==3){	// check if can be blended
				var fa = sb[si+3], fr=sb[si], fg=sb[si+1], fb=sb[si+2]; 
				var ba = tb[ti+3], br=tb[ti], bg=tb[ti+1], bb=tb[ti+2]; 
				if(fa==ba && fr==br && fg==bg && fb==bb) continue;
				//if(fa!=255 && ba!=0) return false;
				if(fa<220 && ba>20) return false;
			}
		}
	return true;
}



UPNG.encode = function(bufs, w, h, ps, dels, forbidPlte)
{
	if(ps==null) ps=0;
	if(forbidPlte==null) forbidPlte = false;
	var data = new Uint8Array(bufs[0].byteLength*bufs.length+100);
	var wr=[0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
	for(var i=0; i<8; i++) data[i]=wr[i];
	var offset = 8,  bin = UPNG._bin, crc = UPNG.crc.crc, wUi = bin.writeUint, wUs = bin.writeUshort, wAs = bin.writeASCII;

	var nimg = UPNG.encode.compressPNG(bufs, w, h, ps, forbidPlte);

	wUi(data,offset, 13);     offset+=4;
	wAs(data,offset,"IHDR");  offset+=4;
	wUi(data,offset,w);  offset+=4;
	wUi(data,offset,h);  offset+=4;
	data[offset] = nimg.depth;  offset++;  // depth
	data[offset] = nimg.ctype;  offset++;  // ctype
	data[offset] = 0;  offset++;  // compress
	data[offset] = 0;  offset++;  // filter
	data[offset] = 0;  offset++;  // interlace
	wUi(data,offset,crc(data,offset-17,17));  offset+=4; // crc

	// 9 bytes to say, that it is sRGB
	wUi(data,offset, 1);      offset+=4;
	wAs(data,offset,"sRGB");  offset+=4;
	data[offset] = 1;  offset++;
	wUi(data,offset,crc(data,offset-5,5));  offset+=4; // crc

	var anim = bufs.length>1;
	if(anim) {
		wUi(data,offset, 8);      offset+=4;
		wAs(data,offset,"acTL");  offset+=4;
		wUi(data,offset, bufs.length);      offset+=4;
		wUi(data,offset, 0);      offset+=4;
		wUi(data,offset,crc(data,offset-12,12));  offset+=4; // crc
	}

	if(nimg.ctype==3) {
		var dl = nimg.plte.length;
		wUi(data,offset, dl*3);  offset+=4;
		wAs(data,offset,"PLTE");  offset+=4;
		for(var i=0; i<dl; i++){
			var ti=i*3, c=nimg.plte[i], r=(c)&255, g=(c>>8)&255, b=(c>>16)&255;
			data[offset+ti+0]=r;  data[offset+ti+1]=g;  data[offset+ti+2]=b;
		}
		offset+=dl*3;
		wUi(data,offset,crc(data,offset-dl*3-4,dl*3+4));  offset+=4; // crc

		if(nimg.gotAlpha) {
			wUi(data,offset, dl);  offset+=4;
			wAs(data,offset,"tRNS");  offset+=4;
			for(var i=0; i<dl; i++)  data[offset+i]=(nimg.plte[i]>>24)&255;
			offset+=dl;
			wUi(data,offset,crc(data,offset-dl-4,dl+4));  offset+=4; // crc
		}
	}
	
	var fi = 0;
	for(var j=0; j<nimg.frames.length; j++)
	{
		var fr = nimg.frames[j];
		if(anim) {
			wUi(data,offset, 26);     offset+=4;
			wAs(data,offset,"fcTL");  offset+=4;
			wUi(data, offset, fi++);   offset+=4;
			wUi(data, offset, fr.rect.width );   offset+=4;
			wUi(data, offset, fr.rect.height);   offset+=4;
			wUi(data, offset, fr.rect.x);   offset+=4;
			wUi(data, offset, fr.rect.y);   offset+=4;
			wUs(data, offset, dels[j]);   offset+=2;
			wUs(data, offset,  1000);   offset+=2;
			data[offset] = fr.dispose;  offset++;	// dispose
			data[offset] = fr.blend  ;  offset++;	// blend
			wUi(data,offset,crc(data,offset-30,30));  offset+=4; // crc
		}
				
		var imgd = fr.cimg, dl = imgd.length;
		wUi(data,offset, dl+(j==0?0:4));     offset+=4;
		var ioff = offset;
		wAs(data,offset,(j==0)?"IDAT":"fdAT");  offset+=4;
		if(j!=0) {  wUi(data, offset, fi++);  offset+=4;  }
		for(var i=0; i<dl; i++) data[offset+i] = imgd[i];
		offset += dl;
		wUi(data,offset,crc(data,ioff,offset-ioff));  offset+=4; // crc
	}

	wUi(data,offset, 0);     offset+=4;
	wAs(data,offset,"IEND");  offset+=4;
	wUi(data,offset,crc(data,offset-4,4));  offset+=4; // crc

	return data.buffer.slice(0,offset);
}

UPNG.encode.compressPNG = function(bufs, w, h, ps, forbidPlte)
{
	var out = UPNG.encode.compress(bufs, w, h, ps, false, forbidPlte);
	for(var i=0; i<bufs.length; i++) {
		var frm = out.frames[i], nw=frm.rect.width, nh=frm.rect.height, bpl=frm.bpl, bpp=frm.bpp;
		var fdata = new Uint8Array(nh*bpl+nh);
		frm.cimg = UPNG.encode._filterZero(frm.img,nh,bpp,bpl,fdata);
	}	
	return out;
}

UPNG.encode.compress = function(bufs, w, h, ps, forGIF, forbidPlte)

  float m = u_has2 ? lumaEnc(in2(p), u_col2) : 1.0;
  vec4 r;
  if (u_mode == 0) r = B;
  else if (u_mode == 1) r = A + B;
  else if (u_mode == 2) r = A * B;
  else if (u_mode == 3) r = 1.0 - (1.0 - A) * (1.0 - B);
  else if (u_mode == 4) r = min(A, B);
  else r = max(A, B);
  vec4 o = mix(A, r, clamp(u_opacity * m, 0.0, 1.0));
  if (u_keepA) o.a = A.a;
  emit(o);
}` };

  S.transform = { nin: 1, body: `
uniform vec2 u_off;
uniform vec2 u_scl;
uniform float u_rot;
void main() {
  vec2 d = pixUV() - 0.5 - u_off;
  vec2 q = vec2(d.x, -d.y);
  float a = radians(u_rot);
  q = mat2(cos(a), -sin(a), sin(a), cos(a)) * q;
  q /= u_scl;
  emit(in0UV(vec2(q.x, -q.y) + 0.5));
}` };

  S.copy = { nin: 1, body: `
void main() { emit(in0(pix())); }` };

  S.gauss = { nin: 1, body: `
uniform ivec2 u_dir;
uniform float u_sigma;
uniform int u_radius;
uniform bool u_rep;
uniform bool u_premul;
uniform bool u_unpremul;
void main() {
  ivec2 p = pix();
  vec4 acc = vec4(0.0); float ws = 0.0;
  float k2 = 1.0 / (2.0 * u_sigma * u_sigma);
  for (int k = -u_radius; k <= u_radius; k++) {
    float w = exp(-float(k * k) * k2);
    vec4 c = in0(wrapPx(p + u_dir * k, u_rep));

  if (u_unpremul) acc.rgb = acc.a > 1e-6 ? acc.rgb / acc.a : vec3(0.0);

}` };

  S.dirblur = { nin: 1, body: `
uniform vec2 u_vec;     // full blur length in UV (image y down)
uniform int u_n;
uniform bool u_aa;      // alpha-aware
void main() {
  vec2 uv = pixUV();
  vec4 acc = vec4(0.0);
  for (int k = 0; k < 256; k++) {
    if (k >= u_n) break;
    float t = u_n == 1 ? 0.0 : float(k) / float(u_n - 1) - 0.5;
    vec4 c = in0UV(uv + u_vec * t);
    if (u_aa) c.rgb *= c.a;

  if (u_aa) acc.rgb = acc.a > 1e-6 ? acc.rgb / acc.a : vec3(0.0);
  emit(acc);
}` };

  S.radial = { nin: 1, body: `
uniform int u_mode;     // 0 zoom, 1 spin
uniform int u_n;
uniform vec2 u_center;
uniform float u_strength;
uniform bool u_aa;
void main() {
  if (u_strength <= 0.0) { emit(in0(pix())); return; }
  vec2 uv = pixUV(), d = uv - u_center;
  vec4 acc = vec4(0.0);
  for (int k = 0; k < 256; k++) {
    if (k >= u_n) break;
    float t = float(k) / float(u_n - 1);
    vec2 s;
    if (u_mode == 0) s = u_center + d * (1.0 - u_strength * t);
    else {
      float a = (t - 0.5) * u_strength * PI;
      s = u_center + mat2(cos(a), sin(a), -sin(a), cos(a)) * d;
    }
    vec4 c = in0UV(s);
    if (u_aa) c.rgb *= c.a;
    acc += c;
  }
  acc /= float(u_n);
  if (u_aa) acc.rgb = acc.a > 1e-6 ? acc.rgb / acc.a : vec3(0.0);
  emit(acc);
}` };

  // Height (in .r, 0..1) -> tangent-space normal. Derivatives are taken per
  // UV unit (value difference * resolution / 2), so strength is resolution
  // independent: u_k = strength / 100 = relief height as a fraction of the
  // texture width. Image y points down; tangent +Y (OpenGL) points up.
  S.normal = { nin: 1, body: `
uniform float u_k;
uniform bool u_rep;
uniform bool u_dx;
uniform bool u_invx;
void main() {
  ivec2 p = pix();
  float hl = in0(wrapPx(p + ivec2(-1, 0), u_rep)).r;
  float hr = in0(wrapPx(p + ivec2(1, 0), u_rep)).r;
  float hu = in0(wrapPx(p + ivec2(0, -1), u_rep)).r;
  float hd = in0(wrapPx(p + ivec2(0, 1), u_rep)).r;
  float dhdx = (hr - hl) * 0.5 * u_res.x;
  float dhdy = (hd - hu) * 0.5 * u_res.y;   // per UV, image-down
  vec3 n = normalize(vec3(-u_k * dhdx, u_k * dhdy, 1.0));
  if (u_invx) n.x = -n.x;
  if (u_dx) n.y = -n.y;
  emit(vec4(n * 0.5 + 0.5, 1.0));
}` };

  S.combine = { nin: 4, body: `
uniform int u_src[4];   // 0 R, 1 G, 2 B, 3 A, 4 luminance, 5 constant
uniform float u_const[4];
uniform bool u_inv[4];
float ch(int i, bool has, vec4 c, bool col) {
  float v = (u_src[i] == 5 || !has) ? u_const[i] : pickChan(c, col, u_src[i]);
  return u_inv[i] ? 1.0 - v : v;
}
void main() {
  ivec2 p = pix();
  emit(vec4(ch(0, u_has0, in0(p), u_col0), ch(1, u_has1, in1(p), u_col1),
            ch(2, u_has2, in2(p), u_col2), ch(3, u_has3, in3(p), u_col3)));
}` };

  // On-screen display (default framebuffer) and thumbnails.
  S.display = { nin: 0, body: `
uniform sampler2D u_tex;
uniform bool u_has;
uniform bool u_isColor;
uniform int u_view;     // 0 RGB, 1 RGBA over checker, 2 R, 3 G, 4 B, 5 A, 6 normal lit
uniform vec2 u_canvas;
uniform float u_zoom;
uniform vec2 u_pan;
uniform bool u_tile3;
uniform bool u_half;
uniform bool u_flip;
uniform bool u_ndx;
uniform vec3 u_light;
uniform vec3 u_bg;
vec3 checker(vec2 fc) { vec2 c = floor(fc / 8.0); return mod(c.x + c.y, 2.0) < 1.0 ? vec3(0.42) : vec3(0.58); }
void main() {
  vec2 fc = gl_FragCoord.xy;
  if (u_flip) fc.y = u_canvas.y - fc.y;
  float size = min(u_canvas.x, u_canvas.y) * u_zoom;
  vec2 uv = (fc - (u_canvas * 0.5 + u_pan)) / size + 0.5;
  if (u_tile3) uv = (uv - 0.5) * 3.0 + 0.5;
  float lim = u_tile3 ? 1.0 : 0.0;
  if (!u_has || any(lessThan(uv, vec2(-lim))) || any(greaterThanEqual(uv, vec2(1.0 + lim)))) {
    fragColor = vec4(u_bg, 1.0); return;
  }
  if (u_half) uv += 0.5;
  float texPerPx = float(textureSize(u_tex, 0).x) / size * (u_tile3 ? 3.0 : 1.0);
  vec4 c;
  if (texPerPx <= 1.0) {
    ivec2 ts = textureSize(u_tex, 0);
    ivec2 t = ivec2(floor(fract(uv) * vec2(ts)));
    c = texelFetch(u_tex, clamp(t, ivec2(0), ts - 1), 0);
  } else {
    // minification: box filter over the pixel footprint (n x n bilinear taps)
    int n = int(min(8.0, ceil(texPerPx * 0.5)));
    float fp = (u_tile3 ? 3.0 : 1.0) / size;
    c = vec4(0.0);
    for (int j = 0; j < 8; j++) {
      if (j >= n) break;
      for (int i = 0; i < 8; i++) {
        if (i >= n) break;
        c += texture(u_tex, uv + (vec2(float(i), float(j)) + 0.5) / float(n) * fp - 0.5 * fp);
      }
    }
    c /= float(n * n);
  }
  if (u_isColor) c.rgb = toSrgb(c.rgb);
  c = clamp(c, 0.0, 1.0);
  vec3 o;
  if (u_view == 0) o = c.rgb;
  else if (u_view == 1) o = mix(checker(fc), c.rgb, c.a);
  else if (u_view == 2) o = vec3(c.r);
  else if (u_view == 3) o = vec3(c.g);
  else if (u_view == 4) o = vec3(c.b);
  else if (u_view == 5) o = vec3(c.a);
  else {
    vec3 n = c.rgb * 2.0 - 1.0;
    if (u_ndx) n.y = -n.y;
    n = normalize(n + vec3(0.0, 0.0, 1e-6));
    float l = max(dot(n, normalize(u_light)), 0.0);
    o = toSrgb(vec3(0.03 + 0.97 * l) * vec3(0.8, 0.78, 0.74));
  }
  fragColor = vec4(o, 1.0);
}` };

  // User GLSL ("Код (GLSL)" node). The user writes
  //   vec4 process(vec2 uv, ivec2 px) { ... }
  // with in0..in3(px) / in0UV..in3UV(uv) readers and p1..p4 parameters.
  const custom = new Map();
  function registerCustom(code) {
    let h = 5381;
    for (let k = 0; k < code.length; k++) h = ((h * 33) ^ code.charCodeAt(k)) >>> 0;
    const name = 'code_' + h.toString(36) + '_' + code.length;
    if (!custom.has(name)) {
      let src = COMMON;
      for (let k = 0; k < 4; k++) src += inputSlot(k);
      src += 'uniform float u_p[4];\n#define p1 u_p[0]\n#define p2 u_p[1]\n#define p3 u_p[2]\n#define p4 u_p[3]\n';
      src += '#line 1\n' + code + '\nvoid main() { emit(process(pixUV() + u_uvOff, pix())); }\n';
      custom.set(name, src);
    }
    return name;
  }

  function build(name) {
    if (custom.has(name)) return custom.get(name);
    const s = S[name];
    if (!s) throw new Error('Нет шейдера ' + name);
    let src = COMMON;
    for (let i = 0; i < s.nin; i++) src += inputSlot(i);
    return src + s.body;
  }

  return { build, registerCustom, names: Object.keys(S), nin: (n) => S[n].nin };
})();


// ===== gpu.js =====
// ---------------------------------------------------------------------------
// GPU: one WebGL2 context, offscreen framebuffer passes, texture pool.
//
// Orientation convention (used everywhere, no hidden flips):
//   texel (x, y) == image pixel (x, y), y = 0 is the TOP row of the image.
//   Fragment shaders write texel (x, y) at gl_FragCoord.xy = (x+.5, y+.5),
//   uploads use UNPACK_FLIP_Y = false, readPixels returns row 0 first,
//   so PNG rows map 1:1 to texture rows. Only the on-screen display pass
//   flips Y, because the canvas' default framebuffer has y = 0 at the bottom.
// ---------------------------------------------------------------------------
const GPU = (() => {
  const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

  const st = {
    gl: null, canvas: null, lost: false, float: false, precisionNote: '',
    programs: new Map(), fbo: null, vao: null, samplers: {}, dummy: null,
    pool: new Map(), live: 0, gen: 0,
  };

  function init(canvas, opts = {}) {
    st.canvas = canvas;
    const gl = canvas.getContext('webgl2', {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false,
    });
    if (!gl) return false;
    st.gl = gl;
    setup(opts);
    return true;
  }

  function setup(opts = {}) {
    const gl = st.gl;
    st.gen++;
    st.programs.clear();
    st.pool.clear();
    st.live = 0;
    st.fbo = gl.createFramebuffer();
    st.vao = gl.createVertexArray();
    gl.disable(gl.BLEND);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.DITHER);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.pixelStorei(gl.PACK_ALIGNMENT, 1);
    const mk = (min, mag, wrap) => {
      const s = gl.createSampler();
      gl.samplerParameteri(s, gl.TEXTURE_MIN_FILTER, min);
      gl.samplerParameteri(s, gl.TEXTURE_MAG_FILTER, mag);
      gl.samplerParameteri(s, gl.TEXTURE_WRAP_S, wrap);
      gl.samplerParameteri(s, gl.TEXTURE_WRAP_T, wrap);
      return s;
    };
    st.samplers = {
      repeat: mk(gl.LINEAR, gl.LINEAR, gl.REPEAT),
      clamp: mk(gl.LINEAR, gl.LINEAR, gl.CLAMP_TO_EDGE),
      mipRepeat: mk(gl.LINEAR_MIPMAP_LINEAR, gl.LINEAR, gl.REPEAT),
      mipClamp: mk(gl.LINEAR_MIPMAP_LINEAR, gl.LINEAR, gl.CLAMP_TO_EDGE),
      nearest: mk(gl.NEAREST, gl.NEAREST, gl.REPEAT),
    };
    st.dummy = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, st.dummy);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    st.float = !opts.forceRGBA8 && detectFloat();
    st.precisionNote = st.float
      ? 'Промежуточные результаты: RGBA16F (half float).'
      : 'Промежуточные результаты: RGBA8 — точность ограничена 8 битами на канал (нет поддержки рендеринга в float-текстуры). Цветные изображения во внутреннем линейном виде теряют точность в тенях.';
  }

  // Real check: RGBA16F must be colour-renderable, filterable (core in WebGL2)
  // and actually hold a value that 8 bits cannot represent.
  function detectFloat() {
    const gl = st.gl;
    if (!gl.getExtension('EXT_color_buffer_float')) return false;
    gl.getExtension('EXT_float_blend');
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, 2, 2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    let ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    if (ok) {
      gl.viewport(0, 0, 2, 2);
      gl.clearColor(0.1234, 1.5, 0.5, 0.25);
      gl.clear(gl.COLOR_BUFFER_BIT);
      const px = new Float32Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px);
      ok = Math.abs(px[0] - 0.1234) < 0.001 && Math.abs(px[1] - 1.5) < 0.01 && gl.getError() === gl.NO_ERROR;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteTexture(t);
    return ok;
  }

  function compile(name, fsrc) {
    const gl = st.gl;
    const sh = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
        const log = gl.getShaderInfoLog(s);
        console.warn(name, log, src.split('\n').map((l, i) => i + 1 + ': ' + l).join('\n'));
        throw new Error('Ошибка компиляции шейдера ' + name + ': ' + log);
      }
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost())
      throw new Error('Ошибка линковки ' + name + ': ' + gl.getProgramInfoLog(p));
    const uniforms = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS) || 0;
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const base = info.name.replace(/\[0\]$/, '');
      uniforms[base] = { loc: gl.getUniformLocation(p, info.name), type: info.type, size: info.size };
    }
    return { p, uniforms };
  }

  function program(name) {
    let pr = st.programs.get(name);
    if (!pr) {
      pr = compile(name, SHADERS.build(name));
      st.programs.set(name, pr);
    }
    return pr;
  }

  // --- textures ------------------------------------------------------------
  // A "Tex" is { tex, size, fmt, gen }. Pool keyed by size/format.
  function fmtOf() { return st.float ? 'f16' : 'u8'; }
  function acquire(size) {
    const key = size + ':' + fmtOf();
    const list = st.pool.get(key);
    if (list && list.length) return list.pop();
    const gl = st.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, st.float ? gl.RGBA16F : gl.RGBA8, size, size);
    st.live++;
    return { tex, size, fmt: fmtOf(), gen: st.gen };
  }
  function release(t) {
    if (!t || t.gen !== st.gen) return;
    const key = t.size + ':' + t.fmt;
    let list = st.pool.get(key);
    if (!list) st.pool.set(key, (list = []));
    list.push(t);
    trimPool();
  }
  // Keep a bounded number of idle textures; free the rest.
  function trimPool() {
    let idle = 0;
    for (const [, list] of st.pool) idle += list.length;
    if (idle <= 12) return;
    for (const [key, list] of st.pool) {
      const size = +key.split(':')[0];
      while (list.length && (idle > 12 || size >= 2048)) {
        st.gl.deleteTexture(list.pop().tex);
        st.live--;
        idle--;
      }
    }
  }
  function freeAll() {
    for (const [, list] of st.pool) for (const t of list) { st.gl.deleteTexture(t.tex); st.live--; }
    st.pool.clear();
  }

  // Upload an 8-bit RGBA image. srgb=true -> SRGB8_ALPHA8 (hardware decodes to
  // linear before filtering), else RGBA8 raw data. Mipmapped for downscaling.
  function uploadImage(rgba, w, h, srgb) {
    const gl = st.gl;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const levels = Math.floor(Math.log2(Math.max(w, h))) + 1;
    gl.texStorage2D(gl.TEXTURE_2D, levels, srgb ? gl.SRGB8_ALPHA8 : gl.RGBA8, w, h);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    gl.generateMipmap(gl.TEXTURE_2D);
    return { tex, w, h, gen: st.gen };
  }
  function deleteImage(t) { if (t && t.gen === st.gen) st.gl.deleteTexture(t.tex); }

  // --- passes --------------------------------------------------------------
  // run(name, target|null, uniforms, opts). Uniform values that are
  // { tex } objects are bound to texture units; opts.samplers maps uniform
  // name -> sampler kind for filtered (texture()) reads.
  function run(name, target, uniforms, opts = {}) {
    const gl = st.gl;
    const pr = program(name);
    gl.useProgram(pr.p);
    if (target) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target.tex, 0);
      gl.viewport(0, 0, target.size, target.size);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, opts.width, opts.height);
    }
    let unit = 0;
    for (const uname in pr.uniforms) {
      const u = pr.uniforms[uname];
      if (u.type === gl.SAMPLER_2D) {
        let v = uniforms[uname];
        gl.activeTexture(gl.TEXTURE0 + unit);
        const valid = v && v.tex && v.gen === st.gen;
        gl.bindTexture(gl.TEXTURE_2D, valid ? v.tex : st.dummy);
        gl.bindSampler(unit, st.samplers[(opts.samplers && opts.samplers[uname]) || 'repeat']);
        gl.uniform1i(u.loc, unit);
        unit++;
        continue;
      }
      if (!(uname in uniforms)) continue;
      setUniform(u, uniforms[uname]);
    }
    gl.bindVertexArray(st.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (target) gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
    for (let i = 0; i < unit; i++) {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, null);
      gl.bindSampler(i, null);
    }
  }

  function setUniform(u, v) {
    const gl = st.gl, L = u.loc;
    const arr = (x) => (Array.isArray(x) || ArrayBuffer.isView(x) ? x : [x]);
    switch (u.type) {
      case gl.FLOAT: u.size > 1 ? gl.uniform1fv(L, arr(v)) : gl.uniform1f(L, +v); break;
      case gl.FLOAT_VEC2: gl.uniform2fv(L, arr(v).flat()); break;
      case gl.FLOAT_VEC3: gl.uniform3fv(L, arr(v).flat()); break;
      case gl.FLOAT_VEC4: gl.uniform4fv(L, arr(v).flat()); break;
      case gl.INT: u.size > 1 ? gl.uniform1iv(L, arr(v).map((x) => x | 0)) : gl.uniform1i(L, v | 0); break;
      case gl.INT_VEC2: gl.uniform2iv(L, arr(v)); break;
      case gl.BOOL: u.size > 1 ? gl.uniform1iv(L, arr(v).map((x) => (x ? 1 : 0))) : gl.uniform1i(L, v ? 1 : 0); break;
      case gl.BOOL_VEC4: gl.uniform4iv(L, arr(v).map((x) => (x ? 1 : 0))); break;
      default: throw new Error('uniform type ' + u.type);
    }
  }

  // Read a texture back as Float32 (float path) or Uint8 (RGBA8 fallback).
  function read(t, x = 0, y = 0, w = t.size, h = t.size) {
    const gl = st.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
    let out;
    if (t.fmt === 'f16') {
      out = new Float32Array(w * h * 4);
      gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, out);
    } else {
      out = new Uint8Array(w * h * 4);
      gl.readPixels(x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, out);
    }
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return out;
  }

  // Small RGBA8 render target for thumbnails (read back once per change).
  let thumbT = null;
  function renderThumb(name, uniforms, size, opts) {
    const gl = st.gl;
    if (!thumbT || thumbT.gen !== st.gen || thumbT.size !== size) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, size, size);
      thumbT = { tex, size, fmt: 'u8', gen: st.gen };
    }
    run(name, thumbT, uniforms, opts);
    return read(thumbT);
  }

  return {
    init, setup, run, read, acquire, release, freeAll, uploadImage, deleteImage, renderThumb,
    get gl() { return st.gl; },
    get float() { return st.float; },
    get precisionNote() { return st.precisionNote; },
    get gen() { return st.gen; },
    get liveTextures() { return st.live; },
    isLost() { return !st.gl || st.gl.isContextLost(); },
  };
})();


// ===== assets.js =====
// ---------------------------------------------------------------------------
// Imported images. The original file bytes are kept (for embedding into the
// project) together with decoded 8-bit RGBA pixels (for GPU upload).
// Assets are immutable; undo snapshots only reference them by id.
// ---------------------------------------------------------------------------
const Assets = (() => {
  const store = new Map();
  let counter = 1;

  function newId() {
    let id;
    do id = 'img' + (counter++).toString(36) + Math.random().toString(36).slice(2, 6);
    while (store.has(id));
    return id;
  }

  function sniff(bytes) {
    if (PNG.isPng(bytes)) return 'image/png';
    if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'image/jpeg';
    return null;
  }

  async function decodeJpeg(bytes) {
    let bmp;
    try {
      bmp = await createImageBitmap(new Blob([bytes], { type: 'image/jpeg' }), {
        premultiplyAlpha: 'none', colorSpaceConversion: 'none',
      });
    } catch (e) {
      throw new Error('JPEG повреждён или не поддерживается браузером.');
    }
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bmp, 0, 0);
    const data = g.getImageData(0, 0, bmp.width, bmp.height).data; // JPEG is opaque: no alpha loss
    bmp.close && bmp.close();
    return { width: c.width, height: c.height, rgba: new Uint8Array(data.buffer.slice(0)), notes: [] };
  }

  // Decode file bytes into an asset. Throws Error with a readable message.
  async function add(bytes, name, forcedId) {
    bytes = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    const mime = sniff(bytes);
    if (!mime) throw new Error(`«${name}»: поддерживаются только PNG и JPEG.`);
    let dec;
    try {
      dec = mime === 'image/png' ? PNG.decode(bytes) : await decodeJpeg(bytes);
    } catch (e) {
      throw new Error(`«${name}»: ${e.message || e}`);
    }
    const id = forcedId || newId();
    const a = { id, name, mime, bytes, width: dec.width, height: dec.height, rgba: dec.rgba,
      notes: dec.notes || [], bitDepth: dec.bitDepth || 8, tex: {} };
    store.set(id, a);
    return a;
  }

  function get(id) { return id ? store.get(id) || null : null; }

  function texture(a, srgb) {
    const k = srgb ? 'srgb' : 'data';
    let t = a.tex[k];
    if (!t || t.gen !== GPU.gen) {
      t = GPU.uploadImage(a.rgba, a.width, a.height, srgb);
      a.tex[k] = t;
    }
    return t;
  }

  // After context loss all GPU handles are invalid; just forget them.
  function dropGpu() { for (const a of store.values()) a.tex = {}; }

  function toBase64(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromBase64(b64) {
    const s = atob(b64);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  function serialize(ids) {
    const out = {};
    for (const id of ids) {
      const a = store.get(id);
      if (a) out[id] = { name: a.name, mime: a.mime, width: a.width, height: a.height, data: toBase64(a.bytes) };
    }
    return out;
  }

  async function loadSerialized(obj) {
    for (const id of Object.keys(obj || {})) {
      if (store.has(id)) continue;
      const e = obj[id];
      if (!e || typeof e.data !== 'string') throw new Error('Проект повреждён: неверная запись изображения ' + id);
      let bytes;
      try { bytes = fromBase64(e.data); } catch (err) { throw new Error('Проект повреждён: изображение ' + id + ' не в base64.'); }
      await add(bytes, e.name || id, id);
    }
  }

  return { add, get, texture, dropGpu, serialize, loadSerialized, toBase64, fromBase64, all: store };
})();

//         'data'  = raw channel numbers (masks, height, normals, packed maps).

const BLACK = [0, 0, 0, 1];

const CLAMP_SEAM = 'Режим Clamp не берёт соседей с противоположного края — при повторе текстуры появится шов.';

const f = (key, label, min, max, def, extra = {}) => ({ key, label, type: 'float', min, max, def, step: extra.step || 0.01, ...extra });
const i = (key, label, min, max, def, extra = {}) => ({ key, label, type: 'int', min, max, def, step: 1, ...extra });
const e = (key, label, options, def, extra = {}) => ({ key, label, type: 'enum', options, def, ...extra });
const b = (key, label, def, extra = {}) => ({ key, label, type: 'bool', def, ...extra });

// conv code for reading an input: 'native' keeps storage, 'data' gives file values,
// 'color' gives linear colour.
function convCode(space, want) {
  if (!space || want === 'native' || want === space) return 0;
  return want === 'data' ? 1 : 2;
}

const CODE_SNIPPET_TITLES = { stripes: 'Полосы', bricks: 'Кирпичи', checker: 'Шахматка', threshold: 'Порог A по p1', mixmask: 'A/B по маске C' };
const CODE_SNIPPETS = {
  stripes: `// Полосы: p1 — частота (×16 полос), p2 — доля белого.
// Целое число полос на текстуру => бесшовно.
vec4 process(vec2 uv, ivec2 px) {
  float n = floor(p1 * 16.0 + 0.5);
  float v = step(fract(uv.x * max(n, 1.0)), p2);
  return vec4(vec3(v), 1.0);
}`,
  bricks: `// Кирпичная кладка: p1 — число рядов (×16), p2 — ширина шва.
vec4 process(vec2 uv, ivec2 px) {
  float rows = max(1.0, floor(p1 * 16.0 + 0.5));
  vec2 g = vec2(uv.x * rows * 0.5, uv.y * rows);
  if (mod(floor(g.y), 2.0) == 1.0) g.x += 0.5;
  vec2 f = fract(g);
  float m = p2 * 0.25;
  float v = step(m, f.x) * step(f.x, 1.0 - m) * step(m * 2.0, f.y) * step(f.y, 1.0 - m * 2.0);
  return vec4(vec3(v), 1.0);
}`,
  checker: `// Шахматка: p1 — число клеток (×16).
vec4 process(vec2 uv, ivec2 px) {
  float n = max(1.0, floor(p1 * 16.0 + 0.5));
  vec2 c = floor(uv * n);
  float v = mod(c.x + c.y, 2.0);
  return vec4(vec3(v), 1.0);
}`,
  threshold: `// Порог: белое там, где яркость A >= p1; p2 — мягкость.
vec4 process(vec2 uv, ivec2 px) {
  float y = dot(in0(px).rgb, LUMA);
  float v = smoothstep(p1 - p2 * 0.5, p1 + p2 * 0.5 + 1e-5, y);
  return vec4(vec3(v), 1.0);
}`,
  mixmask: `// Смешать A и B по яркости маски C (все 4 канала).
vec4 process(vec2 uv, ivec2 px) {
  float m = dot(in2(px).rgb, LUMA);
  return mix(in0(px), in1(px), m);
}`,
};
