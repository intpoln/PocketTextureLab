// Levels / Invert / HSV: operate on file values; colour inputs are
// sRGB-encoded on read and linearised again on write.
function pointwise(ctx, shader, u) {
  const out = ctx.alloc(), sp = ctx.space(0) || 'data';
  ctx.bindIn(u, 0, 0, 'data');
  ctx.pass(shader, out, u, null, sp === 'color' ? 2 : 0);
  return [{ tex: out, space: sp }];
}

// Two-pass separable Gaussian. sigma in evaluation pixels.
function gaussianInto(ctx, src, _slot, out, sigma, repeat, alphaAware) {
  const u = {};
  ctx.bindTex(u, 0, src, 'native');
  if (!src || sigma <= 0.05) { ctx.pass('copy', out, u); return; }
  const radius = Math.min(512, Math.ceil(sigma * 3));
  const tmp = ctx.temp();
  ctx.pass('gauss', tmp, { ...u, u_dir: [1, 0], u_sigma: sigma, u_radius: radius, u_rep: repeat, u_premul: alphaAware, u_unpremul: false });
  const u2 = {};
  ctx.bindTex(u2, 0, { tex: tmp, space: src.space }, 'native');
  ctx.pass('gauss', out, { ...u2, u_dir: [0, 1], u_sigma: sigma, u_radius: radius, u_rep: repeat, u_premul: false, u_unpremul: alphaAware });
}

// Stable sort by position: coincident stops keep list order.
function sortStops(stops) {
  return stops.map((s, k) => ({ ...s, k })).sort((a, b) => a.p - b.p || a.k - b.k);
}

function defaultParams(type) {
  const p = {};
  for (const d of NODES[type].params) p[d.key] = d.def && typeof d.def === 'object' ? JSON.parse(JSON.stringify(d.def)) : d.def;
  return p;
}

function inputLabel(node, k) {
  const def = NODES[node.type];
  if (def.portLabels) return (def.portLabels[node.params[def.presetParam]] || def.portLabels.custom)[k];
  return def.inputs[k].label;
}


// ===== graph.js =====
// ---------------------------------------------------------------------------
// Graph model: nodes, links (one link per input port, fan-out allowed),
// cycle prevention, (de)serialisation and snapshot-based undo/redo.
// ---------------------------------------------------------------------------
const Graph = (() => {
  const g = { nodes: new Map(), links: [], resolution: 512, activeOutput: null, nextId: 1 };
  let stampCounter = 1;

  function newStamp() { return ++stampCounter; }

  function addNode(type, x, y, params, id) {
    if (!NODES[type]) throw new Error('Неизвестный тип ноды: ' + type);
    const p = { ...defaultParams(type), ...(params ? JSON.parse(JSON.stringify(params)) : {}) };
    id = id || 'n' + g.nextId++;
    const node = { id, type, x: Math.round(x), y: Math.round(y), params: p, stamp: newStamp() };
    g.nodes.set(id, node);
    if (type === 'output' && !g.activeOutput) g.activeOutput = id;
    return node;
  }

  function removeNode(id) {
    g.nodes.delete(id);
    g.links = g.links.filter((l) => l.from !== id && l.to !== id);
    if (g.activeOutput === id) {
      const o = [...g.nodes.values()].find((n) => n.type === 'output');
      g.activeOutput = o ? o.id : null;
    }
  }

  function inputLink(to, toPort) { return g.links.find((l) => l.to === to && l.toPort === toPort) || null; }
  function outputsOf(from) { return g.links.filter((l) => l.from === from); }

  // Is `target` reachable downstream from `start`?
  function reaches(start, target) {
    const seen = new Set(), stack = [start];
    while (stack.length) {
      const n = stack.pop();
      if (n === target) return true;
      if (seen.has(n)) continue;
      seen.add(n);
      for (const l of g.links) if (l.from === n) stack.push(l.to);
    }
    return false;
  }

  // Returns null on success or an error message.
  function connect(from, fromPort, to, toPort) {
    const a = g.nodes.get(from), b = g.nodes.get(to);
    if (!a || !b) return 'Нода не найдена.';
    if (from === to) return 'Нельзя соединить ноду саму с собой.';
    if (fromPort >= NODES[a.type].outputs.length || toPort >= NODES[b.type].inputs.length) return 'Неверный порт.';
    if (reaches(to, from)) return 'Соединение создало бы цикл: результат ноды зависел бы сам от себя. Циклы в графе запрещены.';
    g.links = g.links.filter((l) => !(l.to === to && l.toPort === toPort));
    g.links.push({ from, fromPort, to, toPort });
    return null;
  }

  function disconnect(to, toPort) {
    const n = g.links.length;
    g.links = g.links.filter((l) => !(l.to === to && l.toPort === toPort));
    return g.links.length !== n;
  }

  function upstream(id, acc = new Set()) {
    if (acc.has(id)) return acc;
    acc.add(id);
    for (const l of g.links) if (l.to === id) upstream(l.from, acc);
    return acc;
  }

  function toJSON() {
    return {
      resolution: g.resolution,
      activeOutput: g.activeOutput,
      nextId: g.nextId,
      nodes: [...g.nodes.values()].map((n) => ({ id: n.id, type: n.type, x: n.x, y: n.y, params: n.params })),
      links: g.links.map((l) => ({ ...l })),
    };
  }

  // Replace the graph with `data`. Nodes whose type+params did not change keep
  // their stamp, so their cached GPU results stay valid (cheap undo).
  function load(data) {
    validate(data);
    const old = g.nodes;
    g.nodes = new Map();
    for (const n of data.nodes) {
      const prev = old.get(n.id);
      const params = { ...defaultParams(n.type), ...JSON.parse(JSON.stringify(n.params || {})) };
      const same = prev && prev.type === n.type && JSON.stringify(prev.params) === JSON.stringify(params);
      g.nodes.set(n.id, { id: n.id, type: n.type, x: +n.x || 0, y: +n.y || 0, params, stamp: same ? prev.stamp : newStamp() });
    }
    g.links = [];
    for (const l of data.links) {
      if (connect(l.from, l.fromPort | 0, l.to, l.toPort | 0)) console.warn('Пропущена связь', l);
    }
    g.resolution = [256, 512, 1024, 2048].includes(data.resolution) ? data.resolution : 512;
    g.activeOutput = data.activeOutput && g.nodes.has(data.activeOutput) ? data.activeOutput : null;
    if (!g.activeOutput) {
      const o = [...g.nodes.values()].find((n) => n.type === 'output');
      g.activeOutput = o ? o.id : null;
    }
    let maxId = 0;
    for (const id of g.nodes.keys()) { const m = /^n(\d+)$/.exec(id); if (m) maxId = Math.max(maxId, +m[1]); }
    g.nextId = Math.max(data.nextId | 0, maxId + 1);
  }

  function validate(data) {
    if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.links)) throw new Error('Неверная структура проекта: нет списка нод или связей.');
    const ids = new Set();
    for (const n of data.nodes) {
      if (!n || typeof n.id !== 'string' || !NODES[n.type]) throw new Error('Неверная нода в проекте: ' + JSON.stringify(n && n.type));
      if (ids.has(n.id)) throw new Error('Повторяющийся id ноды: ' + n.id);
      ids.add(n.id);
    }
  }

  function touch(node) { node.stamp = newStamp(); }

  return {
    state: g, addNode, removeNode, connect, disconnect, inputLink, outputsOf, reaches, upstream,
    toJSON, load, touch,
    get nodes() { return g.nodes; }, get links() { return g.links; },
  };
})();

// Undo/redo: array of JSON snapshots (graph structure + params only; image
// pixels live in Assets and are referenced by id, never copied).
const History = (() => {
  let states = [], index = -1;
  const LIMIT = 200;
  function reset() { states = [JSON.stringify(Graph.toJSON())]; index = 0; }
  function commit() {
    const s = JSON.stringify(Graph.toJSON());
    if (states[index] === s) return false;
    states = states.slice(0, index + 1);
    states.push(s);
    if (states.length > LIMIT) states.shift();
    index = states.length - 1;
    return true;
  }
  function undo() { if (index <= 0) return false; index--; Graph.load(JSON.parse(states[index])); return true; }
  function redo() { if (index >= states.length - 1) return false; index++; Graph.load(JSON.parse(states[index])); return true; }
  return {
    reset, commit, undo, redo,
    canUndo: () => index > 0, canRedo: () => index < states.length - 1,
    get size() { return states.length; }, get index() { return index; },
  };
})();


// ===== engine.js =====
// ---------------------------------------------------------------------------
// Evaluation engine: per-node GPU result cache keyed by resolution. A node is
// recomputed only when its own stamp (params) or the identity of one of its
// input results changed, so editing one node re-runs it and its dependents.
// ---------------------------------------------------------------------------
const Engine = (() => {
  const caches = new Map();   // nodeId -> Map(res -> entry)
  let keyCounter = 1;
  const errors = new Map();   // nodeId -> message

  function freeEntry(e) {
    if (!e || !e.outs) return;
    for (const o of e.outs) if (o) GPU.release(o.tex);
    e.outs = null;
  }

  function makeCtx(node, inputs, res, projRes, opts) {
    const def = NODES[node.type];
    const temps = [];
    const ctx = {
      node, params: node.params, res, projRes, uvOff: opts.uvOff || [0, 0],
      input: (k) => inputs[k],
      space: (k) => (inputs[k] ? inputs[k].space : null),
      px: (v) => (v * res) / projRes,
      alloc: () => GPU.acquire(res),
      temp: () => { const t = GPU.acquire(res); temps.push(t); return t; },
      bindTex(u, slot, src, want) {
        u['u_in' + slot] = src ? src.tex : null;
        u['u_has' + slot] = !!src;
        u['u_col' + slot] = !!src && src.space === 'color' && want === 'native';
        u['u_conv' + slot] = src ? convCode(src.space, want) : 0;
        u['u_def' + slot] = (def.inputs[slot] && def.inputs[slot].def) || BLACK;
      },
      bindIn(u, slot, k, want) {
        ctx.bindTex(u, slot, inputs[k], want);
        u['u_def' + slot] = (def.inputs[k] && def.inputs[k].def) || BLACK;
      },
      pass(name, target, u, samplers, outConv = 0) {
        GPU.run(name, target, { u_res: [res, res], u_outConv: outConv, u_uvOff: ctx.uvOff, ...u }, { samplers: samplers || {} });
      },
    };
    return { ctx, temps };
  }

  // Evaluate `id` at resolution `res`. memo: Map for this run. store: cache map
  // (the persistent one, or a throwaway one for export).
  function evaluate(id, res, memo, store = caches, opts = {}) {
    if (memo.has(id)) return memo.get(id);
    const node = Graph.nodes.get(id);
    if (!node) return null;
    const def = NODES[node.type];
    const inputs = def.inputs.map((_, k) => {
      const l = Graph.inputLink(id, k);
      if (!l) return null;
      const r = evaluate(l.from, res, memo, store, opts);
      const o = r && r.outs && r.outs[l.fromPort];
      return o ? { tex: o.tex, space: o.space, key: r.key + ':' + l.fromPort } : null;
    });
    const inKey = inputs.map((x) => (x ? x.key : '-')).join('|');
    let m = store.get(id);
    if (!m) store.set(id, (m = new Map()));
    let e = m.get(res);
    if (e && e.outs && e.stamp === node.stamp && e.inKey === inKey && e.gen === GPU.gen && !opts.force) {
      memo.set(id, e);
      return e;
    }
    const { ctx, temps } = makeCtx(node, inputs, res, opts.projRes || Graph.state.resolution, opts);
    let outs;
    try {
      outs = def.eval(ctx);
      errors.delete(id);
    } catch (err) {
      console.warn('eval', node.type, err);
      errors.set(id, err.message || String(err));
      outs = (def.outputs.length ? def.outputs : ['x']).map(() => {
        const t = ctx.alloc();
        ctx.pass('constant', t, { u_color: [0, 0, 0, 1] });
        return { tex: t, space: 'data' };
      });
    }
    for (const t of temps) GPU.release(t);
    if (e && e.gen === GPU.gen) freeEntry(e);
    e = { stamp: node.stamp, inKey, outs, key: keyCounter++, gen: GPU.gen, res };
    m.set(res, e);
    memo.set(id, e);
    return e;
  }

  function get(id, res) {
    const m = caches.get(id);
    const e = m && m.get(res);
    return e && e.outs && e.gen === GPU.gen ? e : null;
  }

  // Drop cached results of other resolutions / removed nodes.
  function purge(keepRes) {
    for (const [id, m] of caches) {
      if (!Graph.nodes.has(id)) { for (const e of m.values()) freeEntry(e); caches.delete(id); continue; }
      for (const [r, e] of m) if (!keepRes.includes(r)) { freeEntry(e); m.delete(r); }
    }
  }

  // After context loss: GPU handles are gone, forget them without deleting.
  function dropGpu() { caches.clear(); }

  // Fresh evaluation at `res` into a temporary store; returns 8-bit RGBA file
  // values. Nothing from the preview cache is reused.
  function renderBytes(id, port, res, opts = {}) {
    const store = new Map();
    try {
      const e = evaluate(id, res, new Map(), store, { ...opts, projRes: opts.projRes || Graph.state.resolution });
      if (!e) throw new Error('Нода не найдена');
      const node = Graph.nodes.get(id);
      let o;
      if (NODES[node.type].outputs.length === 0) o = e.outs[0];
      else o = e.outs[port || 0];
      const raw = GPU.read(o.tex);
      return { bytes: ColorUtil.toBytes(raw, o.space), space: o.space, width: res, height: res, raw };
    } finally {
      for (const m of store.values()) for (const e of m.values()) freeEntry(e);
    }
  }

  function readCachedBytes(id, port, res) {
    const e = get(id, res);
    if (!e) return null;
    const o = e.outs[port || 0];
    return { bytes: ColorUtil.toBytes(GPU.read(o.tex), o.space), space: o.space };
  }

  return { evaluate, get, purge, dropGpu, renderBytes, readCachedBytes, errors, caches };
})();


// ===== ui-graph.js =====
// ---------------------------------------------------------------------------
// Graph view: HTML nodes + SVG wires, pan/zoom, drag to move / connect.
// ---------------------------------------------------------------------------
const GraphView = (() => {
  const $ = (s) => document.querySelector(s);
  let root, inner, nodesEl, wiresEl;
  const view = { x: 40, y: 40, z: 1 };
  const els = new Map();       // id -> { el, ports: {in:[], out:[]}, thumb }
  let tempWire = null;

  function init() {
    root = $('#graph'); inner = $('#graph-inner'); nodesEl = $('#nodes'); wiresEl = $('#wires');
    root.addEventListener('pointerdown', onBgDown);
    root.addEventListener('wheel', onWheel, { passive: false });
    root.addEventListener('dragover', (e) => { e.preventDefault(); });
    root.addEventListener('drop', onDrop);
    $('#btn-fit').onclick = fit;
    $('#btn-layout').onclick = () => { App.autoLayout(); App.commit(); rebuild(); fit(); };
    applyView();
  }

  function applyView() {
    inner.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    $('#zoom-label').textContent = Math.round(view.z * 100) + '%';
  }

  function toGraph(clientX, clientY) {
    const r = root.getBoundingClientRect();
    return { x: (clientX - r.left - view.x) / view.z, y: (clientY - r.top - view.y) / view.z };
  }
  function center() {
    const r = root.getBoundingClientRect();
    return toGraph(r.left + r.width / 2, r.top + r.height / 2);
  }

  // ---- DOM build ----------------------------------------------------------
  function rebuild() {
    nodesEl.textContent = '';
    els.clear();
    for (const n of Graph.nodes.values()) buildNode(n);
    for (const n of Graph.nodes.values()) measure(n.id);
    refreshMarks();
    drawWires();
    $('#graph-empty').innerHTML = Graph.nodes.size ? '' : 'Граф пуст.<br>Перетащите ноду из каталога слева или выберите пример.';
  }

  function buildNode(n) {
    const def = NODES[n.type];
    const el = document.createElement('div');
    el.className = 'node';
    el.dataset.id = n.id;
    el.dataset.cat = def.cat;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `<span class="t"></span><span class="badge out" title="Основной выход (экспорт)"></span><span class="badge err"></span>`;
    head.querySelector('.t').textContent = def.title;
    head.title = def.title + ' — ' + n.id;
    el.appendChild(head);
    const body = document.createElement('div');
    body.className = 'body';
    const ins = document.createElement('div'); ins.className = 'ins';
    const outs = document.createElement('div'); outs.className = 'outs';
    const rec = { el, ins: [], outs: [], thumb: null, pos: { in: [], out: [] }, thumbKey: null };
    def.inputs.forEach((p, k) => {
      const d = document.createElement('div');
      d.className = 'port in';
      d.innerHTML = '<span class="dot"></span><span class="lbl"></span>';
      d.querySelector('.lbl').textContent = inputLabel(n, k);
      d.title = `${inputLabel(n, k)} — не подключён: ${p.defText}`;
      d.dataset.port = k;
      d.querySelector('.dot').addEventListener('pointerdown', (e) => startWireFromIn(e, n.id, k));
      ins.appendChild(d);
      rec.ins.push(d);
    });
    const thumb = document.createElement('canvas');
    thumb.className = 'thumb'; thumb.width = thumb.height = 64;
    rec.thumb = thumb;
    def.outputs.forEach((label, k) => {
      const d = document.createElement('div');
      d.className = 'port out';
      d.innerHTML = '<span class="lbl"></span><span class="dot"></span>';
      d.querySelector('.lbl').textContent = label;
      d.dataset.port = k;
      d.querySelector('.dot').addEventListener('pointerdown', (e) => startWireFromOut(e, n.id, k));
      outs.appendChild(d);
      rec.outs.push(d);
    });
    body.append(ins, thumb, outs);
    el.appendChild(body);
    head.addEventListener('pointerdown', (e) => startMove(e, n.id));
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      if (!e.target.classList.contains('dot')) App.select(n.id);
    });
    el.addEventListener('dragover', (e) => { if (n.type === 'image') e.preventDefault(); });
    el.addEventListener('drop', (e) => {
      if (n.type !== 'image') return;
      e.preventDefault(); e.stopPropagation();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) App.loadImageFile(file, n.id);
    });
    nodesEl.appendChild(el);
    els.set(n.id, rec);
  }

  // Port centres relative to the node's top-left, in graph units.
  function measure(id) {
    const rec = els.get(id);
    if (!rec) return;
    const nr = rec.el.getBoundingClientRect();
    const c = (d) => {
      const r = d.querySelector('.dot').getBoundingClientRect();
      return { x: (r.left + r.width / 2 - nr.left) / view.z, y: (r.top + r.height / 2 - nr.top) / view.z };
    };
    rec.pos.in = rec.ins.map(c);
    rec.pos.out = rec.outs.map(c);
  }

  function updateLabels(id) {
    const n = Graph.nodes.get(id), rec = els.get(id);
    if (!n || !rec) return;
    rec.ins.forEach((d, k) => { d.querySelector('.lbl').textContent = inputLabel(n, k); });
  }

  function refreshMarks() {
    for (const [id, rec] of els) {
      rec.el.classList.toggle('sel', id === App.state.selected);
      rec.el.querySelector('.badge.out').textContent = id === Graph.state.activeOutput ? '★' : '';
      const err = Engine.errors.get(id);
      const be = rec.el.querySelector('.badge.err');
      be.textContent = err ? '⚠' : '';
      be.title = err || '';
      rec.ins.forEach((d, k) => d.querySelector('.dot').classList.toggle('on', !!Graph.inputLink(id, k)));
      rec.outs.forEach((d, k) => d.querySelector('.dot').classList.toggle('on', Graph.links.some((l) => l.from === id && l.fromPort === k)));
    }
  }

  function portPos(id, kind, k) {
    const n = Graph.nodes.get(id), rec = els.get(id);
    if (!n || !rec || !rec.pos[kind][k]) return { x: n ? n.x : 0, y: n ? n.y : 0 };
    return { x: n.x + rec.pos[kind][k].x, y: n.y + rec.pos[kind][k].y };
  }

  function curve(a, b) {
    const dx = Math.max(40, Math.abs(b.x - a.x) * 0.5);
    return `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`;
  }

  function drawWires() {
    const ns = 'http://www.w3.org/2000/svg';
    wiresEl.textContent = '';
    const sel = App.state.selectedLink;
    for (const l of Graph.links) {
      const d = curve(portPos(l.from, 'out', l.fromPort), portPos(l.to, 'in', l.toPort));
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', d);
      p.setAttribute('class', 'w' + (sel && sel.to === l.to && sel.toPort === l.toPort ? ' sel' : ''));
      const h = document.createElementNS(ns, 'path');
      h.setAttribute('d', d);
      h.setAttribute('class', 'hit');
      h.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (e.altKey) { Graph.disconnect(l.to, l.toPort); App.changed({ commit: true, structure: true }); return; }
        App.selectLink({ to: l.to, toPort: l.toPort });
      });
      h.addEventListener('contextmenu', (e) => { e.preventDefault(); Graph.disconnect(l.to, l.toPort); App.changed({ commit: true, structure: true }); });
      h.addEventListener('dblclick', (e) => { e.stopPropagation(); Graph.disconnect(l.to, l.toPort); App.changed({ commit: true, structure: true }); });
      const t = document.createElementNS(ns, 'title');
      t.textContent = 'Связь: щелчок — выбрать (Delete — удалить), двойной щелчок / ПКМ / Alt+щелчок — удалить';
      h.appendChild(t);
      wiresEl.append(p, h);
    }
    if (tempWire) {
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', curve(tempWire.a, tempWire.b));
      p.setAttribute('class', 'temp');
      wiresEl.appendChild(p);
    }
  }

  // ---- interactions -------------------------------------------------------
  function drag(e, onMove, onUp) {
    const target = e.currentTarget || e.target;
    try { target.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    const move = (ev) => onMove(ev);
    const up = (ev) => {
      target.removeEventListener('pointermove', move);
      target.removeEventListener('pointerup', up);
      target.removeEventListener('pointercancel', up);
      onUp(ev);
    };
    target.addEventListener('pointermove', move);
    target.addEventListener('pointerup', up);
    target.addEventListener('pointercancel', up);
  }

  function startMove(e, id) {
    if (e.button !== 0) return;
    e.stopPropagation();
    App.select(id);
    const n = Graph.nodes.get(id), rec = els.get(id);
    const sx = e.clientX, sy = e.clientY, ox = n.x, oy = n.y;
    let moved = false;
    drag(e, (ev) => {
      const dx = (ev.clientX - sx) / view.z, dy = (ev.clientY - sy) / view.z;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      n.x = Math.round(ox + dx); n.y = Math.round(oy + dy);
      rec.el.style.left = n.x + 'px'; rec.el.style.top = n.y + 'px';
      drawWires();
    }, () => { if (moved) App.commit(); });
  }

  function portUnder(x, y, kind) {
    const el = document.elementFromPoint(x, y);
    const port = el && el.closest && el.closest('.port.' + kind);
    if (!port) return null;
    const node = port.closest('.node');
    return { id: node.dataset.id, port: +port.dataset.port, el: port };
  }

  function highlight(hit) {
    document.querySelectorAll('.dot.target').forEach((d) => d.classList.remove('target'));
    if (hit) hit.el.querySelector('.dot').classList.add('target');
  }

  function startWireFromOut(e, id, port) {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    tempWire = { a: portPos(id, 'out', port), b: toGraph(e.clientX, e.clientY) };
    drawWires();
    drag(e, (ev) => { tempWire.b = toGraph(ev.clientX, ev.clientY); highlight(portUnder(ev.clientX, ev.clientY, 'in')); drawWires(); }, (ev) => {
      tempWire = null; highlight(null);
      const hit = portUnder(ev.clientX, ev.clientY, 'in');
      if (hit) App.tryConnect(id, port, hit.id, hit.port);
      else drawWires();
    });
  }

  // Dragging from an input: if connected, pick up the existing wire (drop on
  // empty space removes it); otherwise draw a wire back to an output.
  function startWireFromIn(e, id, port) {
    if (e.button !== 0) return;
    e.stopPropagation(); e.preventDefault();
    const link = Graph.inputLink(id, port);
    if (link) {
      Graph.disconnect(id, port);
      tempWire = { a: portPos(link.from, 'out', link.fromPort), b: toGraph(e.clientX, e.clientY) };
      drawWires();
      drag(e, (ev) => { tempWire.b = toGraph(ev.clientX, ev.clientY); highlight(portUnder(ev.clientX, ev.clientY, 'in')); drawWires(); }, (ev) => {
        tempWire = null; highlight(null);
        const hit = portUnder(ev.clientX, ev.clientY, 'in');
        if (hit) {
          const err = Graph.connect(link.from, link.fromPort, hit.id, hit.port);
          if (err) { Graph.connect(link.from, link.fromPort, id, port); App.toast(err, 'err'); }
        }
        App.changed({ commit: true, structure: true });
      });
      return;
    }
    tempWire = { a: toGraph(e.clientX, e.clientY), b: portPos(id, 'in', port) };
    drag(e, (ev) => { tempWire.a = toGraph(ev.clientX, ev.clientY); highlight(portUnder(ev.clientX, ev.clientY, 'out')); drawWires(); }, (ev) => {
      tempWire = null; highlight(null);
      const hit = portUnder(ev.clientX, ev.clientY, 'out');
      if (hit) App.tryConnect(hit.id, hit.port, id, port);
      else drawWires();
    });
  }

  function onBgDown(e) {
    if (e.target.closest('.node') || e.target.closest('#graph-hud')) return;
    if (e.button !== 0 && e.button !== 1) return;
    e.preventDefault();
    root.focus({ preventScroll: true });
    if (e.button === 0) { App.select(null); App.selectLink(null); }
    const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
    root.classList.add('panning');
    drag(e, (ev) => { view.x = ox + ev.clientX - sx; view.y = oy + ev.clientY - sy; applyView(); }, () => root.classList.remove('panning'));
  }

  function onWheel(e) {
    e.preventDefault();
    const r = root.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const z = Math.min(2.5, Math.max(0.2, view.z * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - ((mx - view.x) * z) / view.z;
    view.y = my - ((my - view.y) * z) / view.z;
    view.z = z;
    applyView();
  }

  function onDrop(e) {
    e.preventDefault();
    const pos = toGraph(e.clientX, e.clientY);
    const type = e.dataTransfer.getData('text/ptl-node');
    if (type) { App.addNode(type, pos.x - 88, pos.y - 20); return; }
    const files = [...(e.dataTransfer.files || [])];
    for (const [k, file] of files.entries()) {
      if (/\.json$/i.test(file.name)) App.openProjectFile(file);
      else App.loadImageFile(file, null, { x: pos.x + k * 30, y: pos.y + k * 30 });
    }
  }

  function fit() {
    const r = root.getBoundingClientRect();
    if (!Graph.nodes.size) { view.x = 40; view.y = 40; view.z = 1; applyView(); return; }
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of Graph.nodes.values()) {
      const rec = els.get(n.id);
      const h = rec ? rec.el.offsetHeight : 100;
      x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + (rec ? rec.el.offsetWidth : 176)); y1 = Math.max(y1, n.y + h);
    }
    const pad = 40;
    const z = Math.min(1.25, Math.max(0.2, Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0))));
    view.z = z;
    view.x = (r.width - (x1 - x0) * z) / 2 - x0 * z;
    view.y = (r.height - (y1 - y0) * z) / 2 - y0 * z;
    applyView();
  }

  function setThumb(id, rgba, key) {
    const rec = els.get(id);
    if (!rec) return;
    rec.thumbKey = key;
    const s = rec.thumb.width;
    const g = rec.thumb.getContext('2d');
    g.putImageData(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, s * s * 4), s, s), 0, 0);
  }
  function thumbKey(id) { const r = els.get(id); return r ? r.thumbKey : null; }

  return { init, rebuild, drawWires, refreshMarks, updateLabels, measure, center, fit, setThumb, thumbKey, view, applyView };
})();


// ===== ui-params.js =====
// ---------------------------------------------------------------------------
// Parameter panel. Built once per selection; slider movement only updates the
// model and the sibling number field, so focus and dragging are preserved.
// One slider drag = one undo step (commit on 'change').
// ---------------------------------------------------------------------------
const ParamsPanel = (() => {
  const $ = (s) => document.querySelector(s);
  let el, current = null, rows = [], seamEl = null, errEl = null, portsEl = null;

  function init() { el = $('#params'); }

  function h(tag, attrs = {}, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    for (const c of kids) if (c != null) e.append(c);
    return e;
  }

  function set(node, key, value, commit) {
    node.params[key] = value;
    const def = NODES[node.type];
    let rebuildAll = false;
    if (def.presetParam === key && def.presetValues && def.presetValues[value]) {
      Object.assign(node.params, def.presetValues[value]);
      rebuildAll = true;
    }
    Graph.touch(node);
    App.changed({ commit, interactive: !commit, node: node.id });
    if (rebuildAll) { GraphView.updateLabels(node.id); build(); }
    else refreshDynamic(key);
  }

  function build() {
    const id = App.state.selected;
    const node = id && Graph.nodes.get(id);
    el.textContent = '';
    rows = [];
    current = node || null;
    if (!node) {
      el.append(h('div', { class: 'hint', text: 'Выберите ноду, чтобы увидеть и изменить её параметры. Выбранная нода показывается в предпросмотре.' }));
      return;
    }
    const def = NODES[node.type];
    el.append(h('h3', { text: def.title }), h('div', { class: 'sub', text: `id: ${node.id} · ${def.cat}` }));
    const actions = h('div', { class: 'actions' },
      h('button', { text: 'Дублировать', title: 'Ctrl+D', onclick: () => App.duplicate(node.id) }),
      h('button', { text: 'Удалить', title: 'Delete', onclick: () => App.removeNode(node.id) }),
      h('button', { text: 'Экспорт PNG', title: 'Экспорт результата этой ноды', onclick: () => App.exportNode(node.id, App.state.viewPort) }));
    if (node.type === 'output') {
      actions.append(h('button', {
        text: Graph.state.activeOutput === node.id ? '★ Основной выход' : 'Сделать основным',
        onclick: () => { Graph.state.activeOutput = node.id; App.changed({ commit: true, structure: true }); build(); },
      }));
    }
    el.append(actions);
    if (def.presets) {
      el.append(h('div', { class: 'actions' }, ...def.presets.map((pr) =>
        h('button', { text: pr.label, onclick: () => { Object.assign(node.params, pr.apply); Graph.touch(node); App.changed({ commit: true, node: node.id }); build(); } }))));
    }
    if (def.help) el.append(h('div', { class: 'hint', text: def.help }));
    seamEl = h('div', { class: 'hint seam' });
    errEl = h('div', { class: 'hint err' });
    el.append(seamEl, errEl);
    if (def.inputs.length) {
      portsEl = h('div', { class: 'ports-list' });
      el.append(h('div', { class: 'group', text: 'Входы' }), portsEl);
    } else portsEl = null;
    let group = null;
    for (const d of def.params) {
      if (d.group && d.group !== group) { group = d.group; el.append(h('div', { class: 'group', text: 'Канал ' + group })); }
      const row = makeRow(node, d);
      rows.push({ d, row });
      el.append(row.el);
    }
    refreshDynamic();
  }

  function labelEl(d) {
    const l = h('label', { text: d.label });
    if (d.help) l.append(h('span', { class: 'q', title: d.help, text: '?' }));
    return l;
  }

  function resetBtn(onclick) { return h('button', { class: 'reset', title: 'Сбросить к значению по умолчанию', text: '↺', onclick }); }

  function makeRow(node, d) {
    const p = node.params;
    const wrap = h('div', { class: 'prow' });
    wrap.dataset.key = d.key;
    const row = { el: wrap, sync: () => {} };
    if (d.type === 'float' || d.type === 'int') {
      const isInt = () => d.type === 'int' || (d.intWhen && d.intWhen(p));
      const range = h('input', { type: 'range', min: d.min, max: d.max, step: d.step });
      const num = h('input', { type: 'number', min: d.hardMin ?? d.min, max: d.hardMax ?? d.max, step: d.step });
      const norm = (v) => {
        v = +v;
        if (!isFinite(v)) v = d.def;
        v = Math.min(d.hardMax ?? d.max, Math.max(d.hardMin ?? d.min, v));
        return isInt() ? Math.round(v) : v;
      };
      row.sync = () => { range.value = p[d.key]; num.value = +(+p[d.key]).toFixed(4); range.step = isInt() ? 1 : d.step; num.step = range.step; };
      range.addEventListener('input', () => { const v = norm(range.value); num.value = v; set(node, d.key, v, false); });
      range.addEventListener('change', () => { const v = norm(range.value); set(node, d.key, v, true); row.sync(); });
      num.addEventListener('change', () => { const v = norm(num.value); set(node, d.key, v, true); row.sync(); });
      num.addEventListener('keydown', (e) => { if (e.key === 'Enter') num.dispatchEvent(new Event('change')); });
      wrap.append(labelEl(d), h('div', { class: 'ctl' }, range, num, resetBtn(() => { set(node, d.key, d.def, true); row.sync(); })));
    } else if (d.type === 'enum') {
      const sel = h('select');
      for (const [v, t] of d.options) sel.append(h('option', { value: v, text: t }));
      row.sync = () => { sel.value = p[d.key]; };
      sel.addEventListener('change', () => set(node, d.key, sel.value, true));
      wrap.append(labelEl(d), h('div', { class: 'ctl' }, sel, resetBtn(() => { set(node, d.key, d.def, true); row.sync(); })));
    } else if (d.type === 'bool') {
      wrap.classList.add('inline');
      const cb = h('input', { type: 'checkbox' });
      row.sync = () => { cb.checked = !!p[d.key]; };
      cb.addEventListener('change', () => set(node, d.key, cb.checked, true));
      const l = labelEl(d);
      l.prepend(cb);
      wrap.append(l, resetBtn(() => { set(node, d.key, d.def, true); row.sync(); }));
    } else if (d.type === 'text') {
      const t = h('input', { type: 'text' });
      t.style.flex = '1';
      row.sync = () => { t.value = p[d.key]; };
      t.addEventListener('change', () => set(node, d.key, t.value.replace(/[\\/:*?"<>|]/g, '_') || d.def, true));
      wrap.append(labelEl(d), h('div', { class: 'ctl' }, t));
    } else if (d.type === 'color') {
      const c = h('input', { type: 'color' });
      const a = h('input', { type: 'range', min: 0, max: 1, step: 0.001 });
      const an = h('input', { type: 'number', min: 0, max: 1, step: 0.01 });
      row.sync = () => { c.value = ColorUtil.hex(p[d.key]); a.value = p[d.key][3]; an.value = +p[d.key][3].toFixed(3); };
      const val = () => [...ColorUtil.fromHex(c.value), Math.min(1, Math.max(0, +a.value))];
      c.addEventListener('input', () => set(node, d.key, val(), false));
      c.addEventListener('change', () => set(node, d.key, val(), true));
      a.addEventListener('input', () => { an.value = a.value; set(node, d.key, val(), false); });
      a.addEventListener('change', () => set(node, d.key, val(), true));
      an.addEventListener('change', () => { a.value = Math.min(1, Math.max(0, +an.value || 0)); set(node, d.key, val(), true); row.sync(); });
      wrap.append(labelEl(d), h('div', { class: 'ctl' }, c, h('span', { text: 'α' }), a, an,
        resetBtn(() => { set(node, d.key, d.def.slice(), true); row.sync(); })));
    } else if (d.type === 'ramp') {
      buildRamp(node, d, wrap, row);
    } else if (d.type === 'image') {
      buildImage(node, d, wrap, row);
    } else if (d.type === 'code') {
      const ta = h('textarea', { spellcheck: 'false' });
      row.sync = () => { ta.value = p[d.key]; };
      const apply = () => { if (ta.value !== p[d.key]) set(node, d.key, ta.value, true); };
      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); apply(); }
        else if (e.key === 'Tab') {
          e.preventDefault();
          const s = ta.selectionStart;
          ta.setRangeText('  ', s, ta.selectionEnd, 'end');
        }
      });
      ta.addEventListener('blur', apply);
      wrap.append(labelEl(d), ta, h('div', { class: 'ctl' },
        h('button', { class: 'primary', text: 'Применить (Ctrl+Enter)', onclick: apply }),
        resetBtn(() => { set(node, d.key, d.def, true); row.sync(); })));
    }
    row.sync();
    return row;
  }

  // ---- Color Ramp editor --------------------------------------------------
  function buildRamp(node, d, wrap, row) {
    const p = node.params;
    let selIdx = 0;
    const bar = h('div', { class: 'bar', title: 'Двойной щелчок — добавить точку' });
    const cv = h('canvas', { width: 256, height: 1 });
    bar.append(cv);
    const marks = h('div', { class: 'marks' });
    const pos = h('input', { type: 'number', min: 0, max: 1, step: 0.01 });
    const col = h('input', { type: 'color' });
    const al = h('input', { type: 'number', min: 0, max: 1, step: 0.01, title: 'Альфа' });
    const add = h('button', { text: '+ точка' });
    const del = h('button', { text: '− точка' });
    const stops = () => p[d.key];
    const commit = (c) => set(node, d.key, stops(), c);

    function draw() { drawBar(); drawMarks(); }
    function drawBar() {
      const g = cv.getContext('2d');
      const img = g.createImageData(256, 1);
      const s = sortStops(stops());
      const interp = p.interp;
      for (let x = 0; x < 256; x++) {
        const t = (x + 0.5) / 256;
        let c;
        if (t < s[0].p) c = s[0].c;
        else if (t >= s[s.length - 1].p) c = s[s.length - 1].c;
        else {
          for (let k = 0; k < s.length - 1; k++) {
            if (t >= s[k].p && t < s[k + 1].p) {
              let f = (t - s[k].p) / (s[k + 1].p - s[k].p);
              if (interp === 'constant') f = 0; else if (interp === 'smooth') f = f * f * (3 - 2 * f);
              c = s[k].c.map((v, j) => v + (s[k + 1].c[j] - v) * f);
              break;
            }
          }
        }
        for (let j = 0; j < 4; j++) img.data[x * 4 + j] = Math.round(c[j] * 255);
      }
      g.putImageData(img, 0, 0);
    }
    function drawMarks() {
      marks.textContent = '';
      stops().forEach((st, k) => {
        const m = h('div', { class: 'mk' + (k === selIdx ? ' sel' : ''), title: `Точка ${k + 1}: ${st.p.toFixed(3)}` });
        m.style.left = st.p * 100 + '%';
        m.style.background = ColorUtil.hex(st.c);
        m.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          selIdx = k; syncEdit(); draw();
          const r = marks.getBoundingClientRect();
          m.setPointerCapture(e.pointerId);
          let moved = false;
          const mv = (ev) => {
            moved = true;
            stops()[k].p = Math.min(1, Math.max(0, +((ev.clientX - r.left) / r.width).toFixed(4)));
            m.style.left = stops()[k].p * 100 + '%';
            pos.value = stops()[k].p;
            commit(false); redrawBar();
          };
          const up = () => { m.removeEventListener('pointermove', mv); m.removeEventListener('pointerup', up); if (moved) commit(true); draw(); };
          m.addEventListener('pointermove', mv);
          m.addEventListener('pointerup', up);
        });
        marks.append(m);
      });
      add.disabled = stops().length >= 8;
      del.disabled = stops().length <= 2;
    }
    function redrawBar() { drawBar(); }
    function syncEdit() {
      const st = stops()[selIdx] || stops()[0];
      pos.value = +st.p.toFixed(4); col.value = ColorUtil.hex(st.c); al.value = +st.c[3].toFixed(3);
    }
    function colorAt(t) {
      const s = sortStops(stops());
      if (t <= s[0].p) return s[0].c.slice();
      for (let k = 0; k < s.length - 1; k++) if (t >= s[k].p && t <= s[k + 1].p) {
        const f = s[k + 1].p > s[k].p ? (t - s[k].p) / (s[k + 1].p - s[k].p) : 0;
        return s[k].c.map((v, j) => v + (s[k + 1].c[j] - v) * f);
      }
      return s[s.length - 1].c.slice();
    }
    function addAt(t) {
      if (stops().length >= 8) { App.toast('Максимум 8 точек.', 'warn'); return; }
      stops().push({ p: +t.toFixed(4), c: colorAt(t) });
      selIdx = stops().length - 1;
      commit(true); syncEdit(); draw();
    }
    pos.addEventListener('change', () => { stops()[selIdx].p = Math.min(1, Math.max(0, +pos.value || 0)); commit(true); syncEdit(); draw(); });
    col.addEventListener('input', () => { const c = ColorUtil.fromHex(col.value); stops()[selIdx].c = [...c, stops()[selIdx].c[3]]; commit(false); draw(); });
    col.addEventListener('change', () => commit(true));
    al.addEventListener('change', () => { stops()[selIdx].c[3] = Math.min(1, Math.max(0, +al.value || 0)); commit(true); syncEdit(); draw(); });
    add.addEventListener('click', () => {
      const s = sortStops(stops());
      let best = 0, gap = -1;
      for (let k = 0; k < s.length - 1; k++) if (s[k + 1].p - s[k].p > gap) { gap = s[k + 1].p - s[k].p; best = k; }
      addAt(s.length > 1 ? (s[best].p + s[best + 1].p) / 2 : 0.5);
    });
    del.addEventListener('click', () => {
      if (stops().length <= 2) return;
      stops().splice(selIdx, 1);
      selIdx = Math.max(0, selIdx - 1);
      commit(true); syncEdit(); draw();
    });
    bar.addEventListener('dblclick', (e) => { const r = bar.getBoundingClientRect(); addAt(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); });
    row.sync = () => { if (selIdx >= stops().length) selIdx = 0; syncEdit(); draw(); };
    row.refresh = draw;
    const box = h('div', { class: 'ramp' }, bar, marks,
      h('div', { class: 'edit' }, h('span', { text: 'Позиция' }), pos, col, h('span', { text: 'α' }), al, add, del,
        resetBtn(() => { set(node, d.key, JSON.parse(JSON.stringify(d.def)), true); selIdx = 0; row.sync(); })));
    wrap.append(labelEl(d), box);
  }

  // ---- Image loader -------------------------------------------------------
  function buildImage(node, d, wrap, row) {
    const info = h('div');
    const box = h('div', { class: 'imgbox' }, info,
      h('div', {}, h('button', { text: 'Загрузить PNG / JPEG…', onclick: () => App.pickImage(node.id) })),
      h('div', { text: 'или перетащите файл сюда / на ноду', style: 'margin-top:4px;color:var(--fg3)' }));
    box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drag'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag'));
    box.addEventListener('drop', (e) => {
      e.preventDefault(); box.classList.remove('drag');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) App.loadImageFile(file, node.id);
    });
    row.sync = () => {
      const a = Assets.get(node.params[d.key]);
      info.textContent = '';
      if (!a) { info.append(h('div', { text: 'Файл не загружен — выход чёрный (0,0,0,1).' })); return; }
      info.append(h('div', { text: a.name, style: 'color:var(--fg);font-weight:600;word-break:break-all' }),
        h('div', { text: `${a.width}×${a.height} · ${a.mime === 'image/png' ? 'PNG ' + a.bitDepth + ' бит' : 'JPEG'}` }));
      const proj = Graph.state.resolution;
      if (a.width !== proj || a.height !== proj) info.append(h('div', { text: `Отличается от проекта (${proj}×${proj}) — применяется режим приведения ниже.`, style: 'color:var(--warn)' }));
      for (const n of a.notes) info.append(h('div', { text: n, style: 'color:var(--warn)' }));
    };
    wrap.append(labelEl(d), box);
  }

  // Visibility conditions, seam hints, input status, errors.
  function refreshDynamic(changedKey) {
    const node = current;
    if (!node || !Graph.nodes.has(node.id)) return;
    const def = NODES[node.type];
    for (const { d, row } of rows) {
      row.el.style.display = d.visible && !d.visible(node.params) ? 'none' : '';
      if (d.intWhen) row.sync();
      if (row.refresh && d.key !== changedKey) row.refresh();
    }
    const seam = [def.seam, def.seamFn && def.seamFn(node.params)].filter(Boolean).join(' ');
    seamEl.textContent = seam ? 'Швы: ' + seam : '';
    seamEl.style.display = seam ? '' : 'none';
    refreshStatus();
  }

  function refreshStatus() {
    const node = current;
    if (!node || !el.contains(errEl)) return;
    const err = Engine.errors.get(node.id);
    errEl.textContent = err ? 'Ошибка: ' + err : '';
    errEl.style.display = err ? '' : 'none';
    if (portsEl) {
      const def = NODES[node.type];
      portsEl.textContent = '';
      def.inputs.forEach((pdef, k) => {
        const l = Graph.inputLink(node.id, k);
        const line = h('div');
        if (l) {
          const src = Graph.nodes.get(l.from);
          line.append(h('span', { class: 'c', text: '● ' }), `${inputLabel(node, k)} ← ${NODES[src.type].title} (${src.id})`);
        } else line.append(`○ ${inputLabel(node, k)}: не подключён → ${pdef.defText}`);
        portsEl.append(line);
      });
    }
  }

  function syncAll() { for (const { row } of rows) row.sync(); refreshDynamic(); }

  return { init, build, refreshStatus, syncAll, get node() { return current; } };
})();


// ===== ui-preview.js =====
// ---------------------------------------------------------------------------
// Preview panel: draws the selected node's cached GPU result on the WebGL
// canvas (no readback), channel views, 3x3 tiling, half offset, normal
// lighting, zoom/pan and a pixel probe (single-pixel readback on hover).
// ---------------------------------------------------------------------------
const Preview = (() => {
  const $ = (s) => document.querySelector(s);
  const st = { view: 0, tile3: false, half: false, zoom: 1, pan: [0, 0], az: 135, el: 40, conv: 'auto', probe: null };
  let canvas, wrap, info, raf = 0;

  function init() {
    canvas = $('#view'); wrap = $('#canvas-wrap'); info = $('#pinfo');
    document.querySelectorAll('#preview [data-view]').forEach((b) => b.addEventListener('click', () => setView({ mode: +b.dataset.view })));
    $('#btn-tile').onclick = () => setView({ tile3: !st.tile3 });
    $('#btn-half').onclick = () => setView({ half: !st.half });
    $('#btn-vfit').onclick = () => { st.zoom = 1; st.pan = [0, 0]; draw(); };
    $('#l-az').oninput = () => { st.az = +$('#l-az').value; draw(); };
    $('#l-el').oninput = () => { st.el = +$('#l-el').value; draw(); };
    $('#l-conv').onchange = () => { st.conv = $('#l-conv').value; draw(); };
    $('#view-port').onchange = () => { App.state.viewPort = +$('#view-port').value; draw(); };
    new ResizeObserver(resize).observe(wrap);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      const mx = (e.clientX - r.left) * dpr - canvas.width / 2, my = (e.clientY - r.top) * dpr - canvas.height / 2;
      const z = Math.min(32, Math.max(0.1, st.zoom * Math.exp(-e.deltaY * 0.0015)));
      st.pan = [mx - ((mx - st.pan[0]) * z) / st.zoom, my - ((my - st.pan[1]) * z) / st.zoom];
      st.zoom = z;
      draw();
    }, { passive: false });
    canvas.addEventListener('pointerdown', (e) => {
      const sx = e.clientX, sy = e.clientY, p0 = st.pan.slice(), dpr = devicePixelRatio || 1;
      canvas.setPointerCapture(e.pointerId);
      const mv = (ev) => { st.pan = [p0[0] + (ev.clientX - sx) * dpr, p0[1] + (ev.clientY - sy) * dpr]; draw(); };
      const up = () => { canvas.removeEventListener('pointermove', mv); canvas.removeEventListener('pointerup', up); };
      canvas.addEventListener('pointermove', mv);
      canvas.addEventListener('pointerup', up);
    });
    canvas.addEventListener('dblclick', () => { st.zoom = 1; st.pan = [0, 0]; draw(); });
    canvas.addEventListener('mousemove', (e) => { st.probe = [e.clientX, e.clientY]; scheduleInfo(); });
    canvas.addEventListener('mouseleave', () => { st.probe = null; scheduleInfo(); });
    syncButtons();
  }

  function setView(o) {
    if ('mode' in o) st.view = o.mode;
    if ('tile3' in o) st.tile3 = !!o.tile3;
    if ('half' in o) st.half = !!o.half;
    if ('zoom' in o) st.zoom = o.zoom;
    syncButtons();
    draw();
  }

  function syncButtons() {
    document.querySelectorAll('#preview [data-view]').forEach((b) => b.classList.toggle('on', +b.dataset.view === st.view));
    $('#btn-tile').classList.toggle('on', st.tile3);
    $('#btn-half').classList.toggle('on', st.half);
    $('#lightbar').classList.toggle('show', st.view === 6);
  }

  function resize() {
    const dpr = devicePixelRatio || 1;
    const w = Math.max(1, Math.round(wrap.clientWidth * dpr)), h = Math.max(1, Math.round(wrap.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    draw();
  }

  // The result currently shown: selected node (or active output), chosen port.
  function current() {
    const id = App.viewedId();
    if (!id) return null;
    const node = Graph.nodes.get(id);
    const e = Engine.get(id, App.state.displayRes) || Engine.get(id, App.previewRes());
    if (!e) return { id, node, entry: null };
    const port = NODES[node.type].outputs.length > 1 ? Math.min(App.state.viewPort, e.outs.length - 1) : 0;
    return { id, node, entry: e, out: e.outs[port], port };
  }

  function normalConv(cur) {
    if (st.conv !== 'auto') return st.conv === 'dx';
    return !!(cur && cur.node && cur.node.type === 'normal' && cur.node.params.convention === 'dx');
  }

  function draw() {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; drawNow(); });
  }

  function lightVec() {
    const a = (st.az * Math.PI) / 180, e = (st.el * Math.PI) / 180;
    return [Math.cos(e) * Math.cos(a), Math.cos(e) * Math.sin(a), Math.sin(e)];
  }

  function drawNow() {
    if (GPU.isLost()) return;
    const cur = current();
    const sel = $('#view-port');
    if (cur && cur.node && NODES[cur.node.type].outputs.length > 1) {
      const outs = NODES[cur.node.type].outputs;
      if (sel.options.length !== outs.length || sel.dataset.node !== cur.id) {
        sel.textContent = '';
        outs.forEach((o, k) => { const op = document.createElement('option'); op.value = k; op.textContent = 'Выход ' + o; sel.append(op); });
        sel.dataset.node = cur.id;
      }
      sel.value = App.state.viewPort;
      sel.style.display = '';
    } else sel.style.display = 'none';
    GPU.run('display', null, {
      u_tex: cur && cur.out ? cur.out.tex : null, u_has: !!(cur && cur.out), u_isColor: !!(cur && cur.out && cur.out.space === 'color'),
      u_view: st.view, u_canvas: [canvas.width, canvas.height], u_zoom: st.zoom, u_pan: st.pan,
      u_tile3: st.tile3, u_half: st.half, u_flip: true, u_ndx: normalConv(cur), u_light: lightVec(), u_bg: [0.063, 0.067, 0.078],
    }, { width: canvas.width, height: canvas.height, samplers: { u_tex: 'repeat' } });
    scheduleInfo();
  }

  let infoRaf = 0;
  function scheduleInfo() { if (!infoRaf) infoRaf = requestAnimationFrame(() => { infoRaf = 0; updateInfo(); }); }

  function updateInfo() {
    const cur = current();
    info.textContent = '';
    if (!cur) { info.textContent = 'Нет выбранной ноды и основного Output.'; return; }
    const add = (t, title) => { const s = document.createElement('span'); s.textContent = t; if (title) s.title = title; info.append(s); };
    add(NODES[cur.node.type].title + (cur.id === App.state.selected ? '' : ' (основной выход)'));
    if (!cur.out) return;
    const res = cur.out.tex.size;
    add(`${res}×${res}` + (res !== Graph.state.resolution ? ` (проект ${Graph.state.resolution})` : ''));
    add(cur.out.space === 'color' ? 'цвет sRGB' : 'данные', cur.out.space === 'color' ? 'Внутри — линейный свет; в файле и на экране — sRGB.' : 'Числа каналов записываются в файл без гамма-коррекции.');
    const texel = probeTexel(res);
    if (texel && !GPU.isLost()) {
      const raw = GPU.read(cur.out.tex, texel[0], texel[1], 1, 1);
      const b = ColorUtil.toBytes(raw, cur.out.space);
      add(`(${texel[0]}, ${texel[1]}): ${b[0]} ${b[1]} ${b[2]} ${b[3]}`, 'Значения пикселя как в экспортируемом 8-битном PNG (R G B A)');
    }
  }

  // Inverse of the display mapping: canvas point -> texel (x, y down).
  function probeTexel(res) {
    if (!st.probe) return null;
    const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    const fx = (st.probe[0] - r.left) * dpr, fy = (st.probe[1] - r.top) * dpr;
    const size = Math.min(canvas.width, canvas.height) * st.zoom;
    let u = (fx - (canvas.width / 2 + st.pan[0])) / size + 0.5;
    let v = (fy - (canvas.height / 2 + st.pan[1])) / size + 0.5;
    if (st.tile3) { u = (u - 0.5) * 3 + 0.5; v = (v - 0.5) * 3 + 0.5; }
    const lim = st.tile3 ? 1 : 0;
    if (u < -lim || v < -lim || u >= 1 + lim || v >= 1 + lim) return null;
    if (st.half) { u += 0.5; v += 0.5; }
    u -= Math.floor(u); v -= Math.floor(v);
    return [Math.min(res - 1, Math.floor(u * res)), Math.min(res - 1, Math.floor(v * res))];
  }

  return { init, draw, resize, setView, state: st };
})();

const App = (() => {

  const CAT_ORDER = ['Источники', 'Обработка', 'Размытие', 'Нормали', 'Каналы', 'Код', 'Выход'];
  const KEYWORDS = {
    image: 'png jpeg jpg файл картинка', constant: 'color цвет value', noise: 'perlin value fbm шум', voronoi: 'cells worley клетки',
    shape: 'circle rect ring круг квадрат кольцо эллипс', gradient: 'ramp linear radial angular', levels: 'уровни контраст',
    invert: 'инверсия negative', grayscale: 'desaturate luminance канал channel', ramp: 'colorize градиент палитра gradient map',
    hsv: 'hue saturation value оттенок', blend: 'mix add multiply screen смешать', transform: 'move scale rotate offset сдвиг поворот',
    gaussian: 'blur размытие', dirblur: 'blur motion размытие', radialblur: 'blur zoom spin размытие', normal: 'normal map bump высота',
    split: 'channels каналы', combine: 'pack orm hdrp mask упаковка', code: 'glsl shader шейдер custom скрипт', output: 'export экспорт',
  };

  // ---------------------------------------------------------------- init
  function init() {
    const canvas = $('#view');
    let ok = false;
    try { ok = GPU.init(canvas, { forceRGBA8: /[?&]rgba8\b/.test(location.search) }); } catch (e) { console.error(e); }
    if (!ok) { fatal(); return false; }
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      $('#lost').classList.add('show');
      Engine.dropGpu(); Assets.dropGpu();
      status('Контекст WebGL потерян. Граф и параметры не затронуты.', true);
    });
    canvas.addEventListener('webglcontextrestored', () => {
      GPU.setup({ forceRGBA8: /[?&]rgba8\b/.test(location.search) });
      $('#lost').classList.remove('show');
      status('Контекст WebGL восстановлен, граф пересчитан.');
      GraphView.rebuild();
      requestEval();
    });
    GraphView.init(); ParamsPanel.init(); Preview.init();
    buildCatalog(); bindToolbar(); bindKeys(); bindSplitters();
    $('#status-gpu').textContent = GPU.precisionNote;
    $('#status-gpu').title = GPU.precisionNote;
    window.addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
    loadGraph(EXAMPLES[0].graph);
    History.reset();
    state.dirty = false;
    state.ready = true;
    updateUndo();
    requestAnimationFrame(() => GraphView.fit());
    return true;
  }

  function fatal() {
    const box = $('#fatal-box');
    box.innerHTML = `<h2 style="margin-top:0;color:var(--err)">WebGL2 недоступен</h2>
      <p>Pocket Texture Lab выполняет всю обработку изображений на видеокарте через WebGL2, а этот браузер не смог создать контекст WebGL2.</p>
      <ul><li>Используйте современный Chrome, Edge, Thorium или Firefox.</li>
      <li>Включите аппаратное ускорение в настройках браузера и перезапустите его.</li>
      <li>В Chromium проверьте страницу <code>chrome://gpu</code> — WebGL2 должен быть «Hardware accelerated».</li>
      <li>Видеодрайвер может быть в чёрном списке браузера — обновите драйвер.</li></ul>
      <p>Программная (CPU) обработка в этой версии не предусмотрена.</p>`;
    $('#fatal').classList.add('show');
  }

  // ---------------------------------------------------------------- UI bits
  function buildCatalog() {
    const list = $('#catalog-list'), search = $('#search');
    const render = () => {
      const q = search.value.trim().toLowerCase();
      list.textContent = '';
      let first = true;
      for (const cat of CAT_ORDER) {
        const items = Object.keys(NODES).filter((t) => NODES[t].cat === cat &&
          (!q || (NODES[t].title + ' ' + t + ' ' + (KEYWORDS[t] || '')).toLowerCase().includes(q)));
        if (!items.length) continue;
        const h = document.createElement('h4'); h.textContent = cat; list.append(h);
        for (const t of items) {
          const it = document.createElement('div');
          it.className = 'item' + (q && first ? ' hl' : '');
          first = false;
          it.textContent = NODES[t].title;
          it.dataset.type = t;
          it.title = 'Щелчок — добавить в центр графа, или перетащите на граф';
          it.draggable = true;
          it.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/ptl-node', t); e.dataTransfer.effectAllowed = 'copy'; });
          it.addEventListener('click', () => { const c = GraphView.center(); addNode(t, c.x - 88 + (Math.random() * 40 - 20), c.y - 50 + (Math.random() * 40 - 20)); });
          list.append(it);
        }
      }
    };
    search.addEventListener('input', render);
    search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { const it = list.querySelector('.item'); if (it) it.click(); }
      if (e.key === 'Escape') { search.value = ''; render(); }
    });
    render();
  }

  function bindToolbar() {
    const ex = $('#examples');
    EXAMPLES.forEach((e, k) => { const o = document.createElement('option'); o.value = k; o.textContent = e.title; ex.append(o); });
    ex.onchange = () => { if (ex.value !== '') loadExample(+ex.value); ex.value = ''; };
    $('#btn-new').onclick = () => newProject();
    $('#btn-open').onclick = () => $('#file-project').click();
    $('#file-project').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) openProjectFile(f); };
    $('#btn-save').onclick = () => saveProject();
    $('#btn-undo').onclick = undo;
    $('#btn-redo').onclick = redo;
    $('#res').onchange = () => setResolution(+$('#res').value);
    $('#pres').onchange = () => requestEval();
    $('#btn-export').onclick = () => exportActive();
    $('#btn-export-sel').onclick = () => { if (state.selected) exportNode(state.selected, state.viewPort); else toast('Сначала выберите ноду.', 'warn'); };
    $('#btn-help').onclick = () => showHelp();
    $('#btn-api').onclick = () => showApi();
    $('#modal-close').onclick = () => $('#modal').classList.remove('show');
    $('#modal').addEventListener('pointerdown', (e) => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); });
    $('#file-image').onchange = (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if (f) loadImageFile(f, pendingImageNode);
    };
    // Drop projects / images anywhere outside the graph too.
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      if (e.defaultPrevented) return;
      e.preventDefault();
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      if (/\.json$/i.test(f.name)) openProjectFile(f);
      else { const c = GraphView.center(); loadImageFile(f, null, c); }
    });
  }

  function isTyping(t) {
    return t && (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['checkbox', 'range', 'color', 'button'].includes(t.type)));
  }

  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      if ($('#modal').classList.contains('show') && e.key === 'Escape') { $('#modal').classList.remove('show'); return; }
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(); return; }
      if (isTyping(e.target)) return;
      if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
      if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); if (state.selected) duplicate(state.selected); return; }
      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (state.selectedLink) {
          Graph.disconnect(state.selectedLink.to, state.selectedLink.toPort);
          state.selectedLink = null;
          changed({ commit: true, structure: true });
        } else if (state.selected) removeNode(state.selected);
        e.preventDefault();
        return;
      }
      if (!mod && e.key.toLowerCase() === 'f') GraphView.fit();
    });
  }

  function bindSplitters() {
    const root = document.documentElement;
    const sv = $('#split-v'), sh = $('#split-h');
    sv.addEventListener('pointerdown', (e) => {
      sv.setPointerCapture(e.pointerId);
      const mv = (ev) => { root.style.setProperty('--right-w', Math.min(window.innerWidth - 360, Math.max(260, window.innerWidth - ev.clientX)) + 'px'); };
      const up = () => { sv.removeEventListener('pointermove', mv); sv.removeEventListener('pointerup', up); };
      sv.addEventListener('pointermove', mv); sv.addEventListener('pointerup', up);
    });
    sh.addEventListener('pointerdown', (e) => {
      sh.setPointerCapture(e.pointerId);
      const top = $('#preview').getBoundingClientRect().top;
      const mv = (ev) => { root.style.setProperty('--preview-h', Math.min(window.innerHeight - 180, Math.max(140, ev.clientY - top)) + 'px'); };
      const up = () => { sh.removeEventListener('pointermove', mv); sh.removeEventListener('pointerup', up); };
      sh.addEventListener('pointermove', mv); sh.addEventListener('pointerup', up);
    });
  }

  function toast(msg, kind = 'info', ms = 4500) {
