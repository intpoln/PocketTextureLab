      <p>Карты-данные (маски, высота, нормали, упакованные каналы) никогда не проходят гамма-коррекцию. Цветные изображения внутри хранятся в линейном свете (размытие и смешивание физически корректны) и кодируются в sRGB при показе и экспорте. Levels, Invert, HSV, Grayscale и Color Ramp работают со значениями как в файле (sRGB).</p>
      <h3>Бесшовность</h3>
      <p>Шумы и Voronoi в режиме Tileable математически периодичны (целый масштаб). Размытия и Height to Normal в режиме Repeat берут соседей с противоположного края. Поворот, градиенты, Clamp, радиальное размытие и произвольные картинки могут давать шов — у таких нод есть подсказка.</p>
      <p style="color:var(--fg3)">${GPU.precisionNote} PNG: UPNG.js (MIT, © Photopea) + pako (MIT/Zlib, © Vitaly Puzrin, Andrei Tuputcyn). Полные тексты лицензий — в исходнике страницы.</p>`);
  }

  function showApi() {
    const g = document.getElementById('ptl-agent-guide');
    const pre = document.createElement('pre');
    pre.textContent = g ? g.textContent.trim() : '';
    modal('API для скриптов и AI-агентов (window.PTL)', '');
    $('#modal-body').append(pre);
  }

  // ---------------------------------------------------------------- model ops
  function updateUndo() {
    $('#btn-undo').disabled = !History.canUndo();
    $('#btn-redo').disabled = !History.canRedo();
  }

  function commit() {
    if (History.commit()) state.dirty = true;
    updateUndo();
  }

  // Central change notification. commit=false => live (interactive) change.
  function changed(o = {}) {
    state.interactive = !!o.interactive;
    if (o.commit) commit();
    if (o.structure) { GraphView.drawWires(); GraphView.refreshMarks(); }
    ParamsPanel.refreshStatus();
    requestEval();
  }

  function tryConnect(a, ap, b, bp) {
    const err = Graph.connect(a, ap, b, bp);
    if (err) { toast(err, 'err'); GraphView.drawWires(); return err; }
    changed({ commit: true, structure: true });
    return null;
  }

  function addNode(type, x, y, params) {
    const n = Graph.addNode(type, x, y, params);
    GraphView.rebuild();
    select(n.id);
    commit();
    requestEval();
    return n;
  }

  function removeNode(id) {
    if (!Graph.nodes.has(id)) return;
    Graph.removeNode(id);
    if (state.selected === id) state.selected = null;
    state.selectedLink = null;
    GraphView.rebuild();
    ParamsPanel.build();
    commit();
    Engine.purge([previewRes(), state.displayRes]);
    requestEval();
  }

  function duplicate(id) {
    const n = Graph.nodes.get(id);
    if (!n) return null;
    return addNode(n.type, n.x + 30, n.y + 30, n.params);
  }

  function select(id) {
    if (id && !Graph.nodes.has(id)) id = null;
    if (state.selected !== id) state.viewPort = 0;
    state.selected = id;
    if (id) state.selectedLink = null;
    GraphView.refreshMarks();
    GraphView.drawWires();
    ParamsPanel.build();
    requestEval();
  }

  function selectLink(l) {
    state.selectedLink = l;
    if (l) { state.selected = null; ParamsPanel.build(); GraphView.refreshMarks(); }
    GraphView.drawWires();
  }

  function viewedId() {
    if (state.selected && Graph.nodes.has(state.selected)) return state.selected;
    return Graph.state.activeOutput && Graph.nodes.has(Graph.state.activeOutput) ? Graph.state.activeOutput : null;
  }

  function afterLoad() {
    if (state.selected && !Graph.nodes.has(state.selected)) state.selected = null;
    state.selectedLink = null;
    $('#res').value = Graph.state.resolution;
    GraphView.rebuild();
    ParamsPanel.build();
    Engine.purge([previewRes()]);
    updateUndo();
    requestEval();
  }

  function undo() { if (History.undo()) { state.dirty = true; afterLoad(); status('Отменено.'); } }
  function redo() { if (History.redo()) { state.dirty = true; afterLoad(); status('Повторено.'); } }

  function loadGraph(data) {
    Graph.load(data);
    state.selected = data.selected && Graph.nodes.has(data.selected) ? data.selected : null;
    afterLoad();
    requestAnimationFrame(() => GraphView.fit());
  }

  function loadExample(k) {
    const ex = EXAMPLES[k];
    if (!ex) return;
    loadGraph(JSON.parse(JSON.stringify(ex.graph)));
    commit();
    status(`Загружен пример «${ex.title}». Предыдущий граф можно вернуть через Отмену.`);
  }

  function newProject() {
    loadGraph({ resolution: Graph.state.resolution, nodes: [], links: [] });
    commit();
    status('Новый пустой проект. Предыдущий граф можно вернуть через Отмену.');
  }

  function setResolution(r) {
    if (![256, 512, 1024, 2048].includes(r)) throw new Error('Разрешение должно быть 256, 512, 1024 или 2048.');
    Graph.state.resolution = r;
    $('#res').value = r;
    commit();
    Engine.purge([previewRes()]);
    ParamsPanel.syncAll();
    requestEval();
  }

  function previewRes() {
    const v = $('#pres').value;
    const r = Graph.state.resolution;
    return v === 'project' ? r : Math.min(r, +v);
  }
  function dragRes(p) { return p <= 512 ? p : Math.max(256, p / 4); }

  // ---------------------------------------------------------------- evaluation
  function requestEval() {
    if (!evalRaf) evalRaf = requestAnimationFrame(tick);
  }

  // Run pending evaluation synchronously (used by the API).
  function flush() {
    if (evalRaf) { cancelAnimationFrame(evalRaf); evalRaf = 0; }
    state.interactive = false;
    tick();
  }

  function tick() {
    evalRaf = 0;
    if (GPU.isLost() || !state.ready && !Graph.nodes) return;
    const pres = previewRes();
    const viewed = viewedId();
    const t0 = performance.now();
    if (state.interactive) {
      const r = dragRes(pres);
      state.displayRes = r;
      if (viewed) Engine.evaluate(viewed, r, new Map());
      // settle to full quality shortly after the last live change
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { state.interactive = false; requestEval(); }, 350);
    } else {
      state.displayRes = pres;
      const memo = new Map();
      if (viewed) Engine.evaluate(viewed, pres, memo);
      for (const id of Graph.nodes.keys()) Engine.evaluate(id, pres, memo);
      Engine.purge([pres]);
      queueThumbs(pres);
    }
    state.lastEvalMs = performance.now() - t0;
    GraphView.refreshMarks();
    ParamsPanel.refreshStatus();
    Preview.draw();
  }

  function queueThumbs(res) {
    thumbQueue = [...Graph.nodes.keys()];
    clearTimeout(thumbTimer);
    const step = () => {
      if (GPU.isLost()) return;
      let n = 0;
      while (thumbQueue.length && n < 6) {
        const id = thumbQueue.shift();
        const e = Engine.get(id, res);
        if (!e || GraphView.thumbKey(id) === e.key) continue;
        const o = e.outs[0];
        const px = GPU.renderThumb('display', {
          u_tex: o.tex, u_has: true, u_isColor: o.space === 'color', u_view: 1, u_canvas: [64, 64], u_zoom: 1, u_pan: [0, 0],
          u_tile3: false, u_half: false, u_flip: false, u_ndx: false, u_light: [0, 0, 1], u_bg: [0, 0, 0],
        }, 64, { samplers: { u_tex: 'repeat' } });
        GraphView.setThumb(id, px, e.key);
        n++;
      }
      if (thumbQueue.length) thumbTimer = setTimeout(step, 16);
    };
    thumbTimer = setTimeout(step, 30);
  }

  // ---------------------------------------------------------------- files
  function download(bytes, name, mime) {
    const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  function exportRes() {
    const v = $('#exres').value;
    return v === 'project' ? Graph.state.resolution : +v;
  }

  function exportFileName(id, port) {
    const n = Graph.nodes.get(id), def = NODES[n.type];
    if (n.type === 'output') return (n.params.filename || 'texture') + '.png';
    return `${n.type}_${n.id}${def.outputs.length > 1 ? '_' + def.outputs[port || 0] : ''}.png`;
  }

  async function encodeNode(id, port = 0, res = exportRes()) {
    const r = Engine.renderBytes(id, port, res);
    return { png: await PNG.encodeAsync(r.bytes, res, res), ...r };
  }

  async function exportNode(id, port = 0) {
    if (!Graph.nodes.has(id)) return;
    try {
      const res = exportRes();
      const t0 = performance.now();
      status('Экспорт…');
      const { png } = await encodeNode(id, port, res);
      const name = exportFileName(id, port);
      download(png, name, 'image/png');
      toast(`Экспортировано: ${name} (${res}×${res}, ${(png.length / 1024).toFixed(0)} КБ, ${Math.round(performance.now() - t0)} мс)`);
    } catch (e) {
      console.warn(e);
      toast('Ошибка экспорта: ' + e.message, 'err');
    }
  }

  async function exportActive() {
    const id = Graph.state.activeOutput;
    if (!id || !Graph.nodes.has(id)) { toast('В графе нет ноды Output. Добавьте «Выход (Output)» или используйте «PNG выбранной».', 'warn'); return; }
    await exportNode(id, 0);
  }

  function projectData() {
    const g = Graph.toJSON();
    const ids = new Set();
    for (const n of g.nodes) if (n.type === 'image' && n.params.asset) ids.add(n.params.asset);
    return {
      format: 'pocket-texture-lab', version: 1, app: 'Pocket Texture Lab', saved: new Date().toISOString(),
      ...g, selected: state.selected, view: { ...GraphView.view },
      assets: Assets.serialize(ids),
    };
  }

  function saveProject() {
    const data = projectData();
    const out = Graph.nodes.get(Graph.state.activeOutput);
    const name = ((out && out.params.filename) || 'project') + '.ptl.json';
    download(JSON.stringify(data), name, 'application/json');
    state.dirty = false;
    toast('Проект сохранён: ' + name);
  }

  async function loadProjectData(data) {
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch (e) { throw new Error('Файл не является корректным JSON.'); }
    }
    if (!data || data.format !== 'pocket-texture-lab') throw new Error('Это не проект Pocket Texture Lab (нет поля format).');
    if (!(data.version >= 1)) throw new Error('Неизвестная версия формата проекта.');
    if (data.version > 1) throw new Error(`Проект сохранён более новой версией формата (${data.version}); эта версия поддерживает 1.`);
    await Assets.loadSerialized(data.assets || {});
    for (const n of data.nodes || []) {
      if (n.type === 'image' && n.params && n.params.asset && !Assets.get(n.params.asset))
        throw new Error('В проекте нет встроенного изображения ' + n.params.asset);
    }
    loadGraph(data);
    commit();
    if (data.view) { Object.assign(GraphView.view, data.view); GraphView.applyView(); }
  }

  async function openProjectFile(file) {
    try {
      const text = await file.text();
      await loadProjectData(text);
      state.dirty = false;
      toast('Проект открыт: ' + file.name);
    } catch (e) {
      console.warn(e);
      toast('Не удалось открыть проект «' + file.name + '»: ' + e.message, 'err');
    }
  }

  let pendingImageNode = null;
  function pickImage(nodeId) { pendingImageNode = nodeId; $('#file-image').click(); }

  async function loadImageBytes(bytes, name, nodeId, pos) {
    const a = await Assets.add(bytes, name);
    let node = nodeId && Graph.nodes.get(nodeId);
    if (!node) {
      const c = pos || GraphView.center();
      node = Graph.addNode('image', c.x - 88, c.y - 40, { asset: a.id, interp: 'srgb' });
      GraphView.rebuild();
    } else {
      node.params.asset = a.id;
      Graph.touch(node);
    }
    select(node.id);
    commit();
    requestEval();
    const note = a.notes.length ? ' ' + a.notes.join(' ') : '';
    toast(`Загружено: ${name} (${a.width}×${a.height}).${note}`, a.notes.length ? 'warn' : 'info');
    return node.id;
  }

  async function loadImageFile(file, nodeId, pos) {
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      return await loadImageBytes(bytes, file.name, nodeId, pos);
    } catch (e) {
      console.warn(e);
      toast('Не удалось загрузить изображение: ' + e.message, 'err');
      return null;
    }
  }

  // Arrange nodes in columns by longest path from sources.
  function autoLayout() {
    const depth = new Map();
    const d = (id, stack = new Set()) => {
      if (depth.has(id)) return depth.get(id);
      if (stack.has(id)) return 0;
      stack.add(id);
      let m = 0;
      for (const l of Graph.links) if (l.to === id) m = Math.max(m, d(l.from, stack) + 1);
      depth.set(id, m);
      return m;
    };
    for (const id of Graph.nodes.keys()) d(id);
    const cols = new Map();
    for (const n of Graph.nodes.values()) {
      const k = depth.get(n.id);
      if (!cols.has(k)) cols.set(k, []);
      cols.get(k).push(n);
    }
    for (const [k, list] of cols) {
      list.sort((a, b) => a.y - b.y);
      let y = 0;
      for (const n of list) {
        n.x = k * 230; n.y = y;
        y += 70 + Math.max(64, 20 * Math.max(NODES[n.type].inputs.length, NODES[n.type].outputs.length)) + 40;
      }
    }
  }

  return {
    init, state, changed, commit, tryConnect, addNode, removeNode, duplicate, select, selectLink, viewedId,
    undo, redo, flush, loadExample, newProject, setResolution, previewRes, requestEval, toast, status,
    exportNode, exportActive, encodeNode, saveProject, projectData, loadProjectData, openProjectFile,
    pickImage, loadImageFile, loadImageBytes, autoLayout, loadGraph, afterLoad, updateUndo,
  };
})();


// ===== api.js =====
// ---------------------------------------------------------------------------
// window.PTL — programmatic API for scripts and AI agents. Every mutating call
// updates the UI and is one undo step (use PTL.batch(fn) to group several).
// See the embedded guide (#ptl-agent-guide) or PTL.help().
// ---------------------------------------------------------------------------
const PTL = (() => {
  let batchDepth = 0, batchDirty = false;

  function need(id) {
    const n = Graph.nodes.get(id);
    if (!n) throw new Error(`PTL: нет ноды "${id}". Существующие: ${[...Graph.nodes.keys()].join(', ') || '(пусто)'}`);
    return n;
  }

  function after(structure = true) {
    if (batchDepth > 0) { batchDirty = true; return; }
    App.commit();
    App.afterLoad();
  }

  function paramInfo(d) {
    const o = { key: d.key, type: d.type, default: d.def };
    if (d.label) o.label = d.label;
    if (d.min != null) { o.min = d.hardMin ?? d.min; o.max = d.hardMax ?? d.max; }
    if (d.options) o.options = d.options.map(([v, t]) => ({ value: v, label: t }));
    if (d.help) o.help = d.help;
    return o;
  }

  function checkParams(type, params) {
    const defs = Object.fromEntries(NODES[type].params.map((d) => [d.key, d]));
    const out = {};
    for (const k of Object.keys(params || {})) {
      const d = defs[k];
      if (!d) throw new Error(`PTL: у ноды "${type}" нет параметра "${k}". Есть: ${Object.keys(defs).join(', ')}`);
      let v = params[k];
      if (d.type === 'float' || d.type === 'int') {
        v = Number(v);
        if (!isFinite(v)) throw new Error(`PTL: параметр ${k} должен быть числом`);
        v = Math.min(d.hardMax ?? d.max, Math.max(d.hardMin ?? d.min, v));
        if (d.type === 'int') v = Math.round(v);
      } else if (d.type === 'enum') {
        if (!d.options.some(([ov]) => ov === v)) throw new Error(`PTL: ${k} = "${v}" недопустимо. Варианты: ${d.options.map((o) => o[0]).join(', ')}`);
      } else if (d.type === 'bool') v = !!v;
      else if (d.type === 'color') {
        if (!Array.isArray(v) || v.length < 3) throw new Error(`PTL: ${k} — массив [r,g,b,a] 0..1 (sRGB)`);
        v = [0, 1, 2, 3].map((i) => Math.min(1, Math.max(0, i < v.length ? +v[i] : 1)));
      } else if (d.type === 'ramp') {
        if (!Array.isArray(v) || v.length < 2 || v.length > 8) throw new Error(`PTL: ${k} — от 2 до 8 точек {p, c:[r,g,b,a]}`);
        v = v.map((s) => ({ p: Math.min(1, Math.max(0, +s.p)), c: [0, 1, 2, 3].map((i) => Math.min(1, Math.max(0, i < s.c.length ? +s.c[i] : 1))) }));
      } else if (d.type === 'text' || d.type === 'code') v = String(v);
      out[k] = v;
    }
    return out;
  }

  function toBytes(src) {
    if (src instanceof Uint8Array) return src;
    if (src instanceof ArrayBuffer) return new Uint8Array(src);
    if (typeof src === 'string') {
      const m = /^data:[^;]*;base64,(.*)$/.exec(src);
      return Assets.fromBase64(m ? m[1] : src);
    }
    throw new Error('PTL: изображение — Uint8Array, ArrayBuffer, base64 или data:URL');
  }

  const api = {
    version: '1.0',
    help() { const g = document.getElementById('ptl-agent-guide'); return g ? g.textContent.trim() : ''; },

    // ---- discovery
    nodeTypes() {
      return Object.entries(NODES).map(([type, d]) => ({
        type, title: d.title, category: d.cat,
        inputs: d.inputs.map((p, k) => ({ index: k, label: p.label, whenUnconnected: p.defText })),
        outputs: d.outputs.map((o, k) => ({ index: k, label: o })),
        params: d.params.map(paramInfo), presets: (d.presets || []).map((p) => p.label), help: d.help || '',
      }));
    },
    getGraph() { return JSON.parse(JSON.stringify(Graph.toJSON())); },
    getNode(id) { const n = need(id); return { id: n.id, type: n.type, x: n.x, y: n.y, params: JSON.parse(JSON.stringify(n.params)), error: Engine.errors.get(id) || null }; },
    getParams(id) { return JSON.parse(JSON.stringify(need(id).params)); },
    errors() { App.flush(); return Object.fromEntries(Engine.errors); },
    info() {
      return { resolution: Graph.state.resolution, previewResolution: App.previewRes(), floatTextures: GPU.float, precision: GPU.precisionNote,
        selected: App.state.selected, activeOutput: Graph.state.activeOutput, nodeCount: Graph.nodes.size, canUndo: History.canUndo(), canRedo: History.canRedo() };
    },

    // ---- editing
    addNode(type, opts = {}) {
      if (!NODES[type]) throw new Error(`PTL: неизвестный тип "${type}". Есть: ${Object.keys(NODES).join(', ')}`);
      let { x, y } = opts;
      if (x == null || y == null) {
        const xs = [...Graph.nodes.values()];
        x = xs.length ? Math.max(...xs.map((n) => n.x)) + 230 : 0;
        y = 0;
      }
      const n = Graph.addNode(type, x, y, checkParams(type, opts.params || {}));
      if (opts.select !== false && batchDepth === 0) App.state.selected = n.id;
      after();
      return n.id;
    },
    removeNode(id) { need(id); Graph.removeNode(id); if (App.state.selected === id) App.state.selected = null; after(); },
    duplicate(id) { const n = need(id); return api.addNode(n.type, { x: n.x + 30, y: n.y + 30, params: n.params }); },
    setParams(id, patch) {
      const n = need(id);
      const v = checkParams(n.type, patch);
      const def = NODES[n.type];
      if (def.presetParam && v[def.presetParam] && def.presetValues[v[def.presetParam]]) Object.assign(n.params, def.presetValues[v[def.presetParam]]);
      Object.assign(n.params, v);
      Graph.touch(n);
      after();
      return api.getParams(id);
    },
    applyPreset(id, label) {
      const n = need(id), pr = (NODES[n.type].presets || []).find((p) => p.label === label);
      if (!pr) throw new Error(`PTL: пресет "${label}" не найден. Есть: ${(NODES[n.type].presets || []).map((p) => p.label).join(' | ')}`);
      Object.assign(n.params, pr.apply); Graph.touch(n); after();
    },
    moveNode(id, x, y) { const n = need(id); n.x = Math.round(x); n.y = Math.round(y); after(); },
    connect(fromId, fromPort, toId, toPort) {
      need(fromId); need(toId);
      const err = Graph.connect(fromId, fromPort | 0, toId, toPort | 0);
      if (err) throw new Error('PTL: ' + err);
      after();
    },
    disconnect(toId, toPort) { need(toId); const ok = Graph.disconnect(toId, toPort | 0); after(); return ok; },
    select(id) { if (id != null) need(id); App.select(id || null); },
    setActiveOutput(id) { const n = need(id); if (n.type !== 'output') throw new Error('PTL: активным может быть только узел output'); Graph.state.activeOutput = id; after(); },
    setResolution(r) { App.setResolution(+r); },
    undo() { App.undo(); return History.canUndo(); },
    redo() { App.redo(); return History.canRedo(); },
    batch(fn) {
      batchDepth++;
      try { return fn(api); } finally {
        batchDepth--;
        if (batchDepth === 0 && batchDirty) { batchDirty = false; App.commit(); App.afterLoad(); }
      }
    },
    autoLayout() { App.autoLayout(); after(); },
    newProject() { App.newProject(); },
    loadExample(i) { App.loadExample(i | 0); },
    examples() { return EXAMPLES.map((e, i) => ({ index: i, title: e.title })); },

    // ---- images & projects
    async importImage(src, opts = {}) {
      const nodeId = opts.nodeId || null;
      if (nodeId) need(nodeId);
      const id = await App.loadImageBytes(toBytes(src), opts.name || 'image.png', nodeId, opts.x != null ? { x: opts.x, y: opts.y } : null);
      if (!id) throw new Error('PTL: не удалось загрузить изображение');
      if (opts.interp || opts.fit) api.setParams(id, { ...(opts.interp && { interp: opts.interp }), ...(opts.fit && { fit: opts.fit }) });
      return id;
    },
    saveProject() { return App.projectData(); },
    async loadProject(data) { await App.loadProjectData(typeof data === 'string' ? data : JSON.parse(JSON.stringify(data))); },

    // ---- rendering (fresh evaluation at the requested size, like export)
    render(id, opts = {}) {
      need(id);
      const size = opts.size || Graph.state.resolution;
      if (![256, 512, 1024, 2048].includes(size) && !(size >= 1 && size <= 4096)) throw new Error('PTL: size 1..4096');
      const r = Engine.renderBytes(id, opts.port || 0, size);
      return { width: size, height: size, space: r.space, rgba: r.bytes };
    },
    async renderPNG(id, opts = {}) {
      need(id);
      const size = opts.size || Graph.state.resolution;
      return (await App.encodeNode(id, opts.port || 0, size)).png;
    },
    async renderPNGBase64(id, opts) { return Assets.toBase64(await api.renderPNG(id, opts)); },
    async renderDataURL(id, opts) { return 'data:image/png;base64,' + (await api.renderPNGBase64(id, opts)); },
    pixel(id, x, y, opts = {}) {
      const r = api.render(id, opts);
      const o = (y * r.width + x) * 4;
      return Array.from(r.rgba.subarray(o, o + 4));
    },
    stats(id, opts = {}) {
      const r = api.render(id, { size: opts.size || 256, port: opts.port });
      const min = [255, 255, 255, 255], max = [0, 0, 0, 0], sum = [0, 0, 0, 0];
      for (let i = 0; i < r.rgba.length; i += 4) for (let c = 0; c < 4; c++) {
        const v = r.rgba[i + c]; if (v < min[c]) min[c] = v; if (v > max[c]) max[c] = v; sum[c] += v;
      }
      const n = r.rgba.length / 4;
      return { size: r.width, space: r.space, min, max, mean: sum.map((s) => +(s / n).toFixed(2)) };
    },
    async exportPNG(id, opts = {}) {
      id = id || Graph.state.activeOutput;
      need(id);
      await App.exportNode(id, opts.port || 0);
    },

    // ---- view
    setView(o) { Preview.setView(o || {}); },
    fitGraph() { GraphView.fit(); },
    whenIdle() { return new Promise((res) => requestAnimationFrame(() => requestAnimationFrame(res))); },

    // ---- testing hooks (used by the automated test suite)
    _test: {
      renderRaw(id, size, uvOff) {
        const r = Engine.renderBytes(id, 0, size, { uvOff: uvOff || [0, 0] });
        return { bytes: r.bytes, space: r.space };
      },
      cached(id, port) { return Engine.readCachedBytes(id, port || 0, App.state.displayRes); },
      liveTextures: () => GPU.liveTextures,
      historySize: () => History.size,
    },
  };
  return api;
})();
window.PTL = PTL;


// ===== main.js =====
// Entry point.
(() => {
  const start = () => {
    try {
      if (App.init()) console.info('Pocket Texture Lab ready. Automation/agents: window.PTL — call PTL.help() for the manual.');
    } catch (e) {
      console.error(e);
      const box = document.getElementById('fatal-box');
      box.innerHTML = '<h2 style="margin-top:0;color:var(--err)">Ошибка запуска</h2><pre style="white-space:pre-wrap"></pre>';
      box.querySelector('pre').textContent = String(e && e.stack || e);
      document.getElementById('fatal').classList.add('show');
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();


</script>
